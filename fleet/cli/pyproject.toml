[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krabby-fleet-cli"
version = "0.1.0"
description = "krabby-fleet: operator CLI for the Krabby fleet"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "requests>=2.31.0",
    "pycognito>=2024.5.1",
    "pyjwt>=2.8.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
]

[project.scripts]
krabby-fleet = "krabby_fleet_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["krabby_fleet_cli*"]
