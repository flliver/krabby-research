# Four-stage bench harness on a self-hosted Orin
# (install → flash → bringup → motion).
#
# Two jobs (mutually exclusive via BENCH_RUNNER_ENABLED):
#   harness      — runs on [self-hosted, krabby-bench] when the variable is true
#   stub-status  — green no-op on ubuntu-latest when the variable is not true
#                  (keeps pushes green with no Orin; appears as Skipped when
#                  the runner is enabled — that skipped row is expected)
#
# Setup (register runner, set variable, smoke): bench/SELF-HOSTED-RUNNER.md
# Optional: secret DISCORD_WEBHOOK_URL for PASS/FAIL notify.
#
# Triggers: push to main (dev) / release/** (stable), or workflow_dispatch.

name: Bench harness

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  harness:
    name: install → flash → bringup → motion
    # Off when BENCH_RUNNER_ENABLED != true (avoids a forever-queued self-hosted job).
    if: ${{ vars.BENCH_RUNNER_ENABLED == 'true' }}
    runs-on: [self-hosted, krabby-bench]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run four-stage harness
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # Dual-use Orin: harness owns ~/.venv-krabby-bench via bench-reset.sh;
          # never deletes ~/.venv-krabby.
          python3 -m venv /tmp/ci-bench-venv
          # shellcheck disable=SC1091
          source /tmp/ci-bench-venv/bin/activate
          pip install -U pip
          pip install -e ./bench
          SUBJECT="$(git log -1 --pretty=%s || true)"
          krabby-bench harness \
            --repo-root "${GITHUB_WORKSPACE}" \
            --commit "${GITHUB_SHA}" \
            --commit-subject "${SUBJECT}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # Placeholder so the workflow stays green before any Orin is enabled.
  # When BENCH_RUNNER_ENABLED=true this job is Skipped (UI still shows the name).
  stub-status:
    name: Runner not enabled (stub)
    if: ${{ vars.BENCH_RUNNER_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "BENCH_RUNNER_ENABLED is not 'true' — Orin harness job skipped."
          echo "Register a self-hosted Orin (labels: self-hosted, krabby-bench),"
          echo "set Actions variable BENCH_RUNNER_ENABLED=true, then re-run."
          echo "See bench/SELF-HOSTED-RUNNER.md"
