# Run the full Python unit suite (tests/unit/) on push/PR.
# Installs internal package wheels so imports match a real install.
# Native firmware C++ tests stay in test-firmware.yml.

name: Unit tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-tk

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: test-unit-pip-${{ runner.os }}-py312-all-unit

      - name: Install shared Python dependencies
        run: |
          pip install pytest pytest-cov pytest-timeout pytest-asyncio \
            keyboard pyserial pyyaml scipy av
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install rsl-rl-lib==3.1.2

      - name: Build and install internal package wheels
        run: |
          ROOT="$GITHUB_WORKSPACE"
          build_install() {
            echo "Building and installing $1..."
            (cd "$ROOT/$1" && python -m build --wheel --no-isolation && pip install dist/*.whl)
          }
          # Order matches publish-packages dependency graph (hal-client before consumers).
          build_install firmware
          build_install hal/server
          build_install hal/client
          build_install compute/parkour
          build_install data_collection
          build_install controller
          build_install teleop/edge
          build_install teleop/portal
          build_install hal/server/isaac
          build_install hal/server/jetson
          build_install hal/tools
          build_install krabby
          build_install bench

      - name: Run all unit tests
        run: |
          pytest tests/unit/ -q --timeout=60 --timeout-method=thread
