name: Firmware tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # list failed steps / prior run for Discord

concurrency:
  group: firmware-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-tk
          python -m pip install pytest pytest-timeout pyserial keyboard gcovr

      - name: Run native firmware tests and coverage gate
        run: make -C firmware test-native-coverage

      - name: Run Python firmware tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q tests/unit/firmware --timeout=60 --timeout-method=thread

      # FAIL always; PASS only after a non-green prior run (recovery).
      - name: Discord notify
        if: success() || failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          pip install -q requests
          pip install -q -e ./bench
          python - <<'PY'
          import os
          from krabby_bench._discord import notify_ci_result

          ok = os.environ.get("JOB_STATUS") == "success"
          branch = (
              os.environ.get("GITHUB_HEAD_REF")
              or os.environ.get("GITHUB_REF_NAME")
              or ""
          )
          notify_ci_result(
              ok=ok,
              title="firmware-tests",
              failed_stage=(None if ok else "test"),
              branch=branch,
              detail=(
                  "Firmware unit/native suite green again."
                  if ok
                  else "Firmware native or Python unit tests failed."
              ),
              collapse_consecutive_pass=True,
          )
          PY
