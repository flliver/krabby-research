<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rate Renders — M11</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- STO-SCN-146: top-level tab bar (Rank | Scenes). Scenes is a sibling tab
       reusing the Studio shell; its logic lives in scenes.js (app.js untouched). -->
  <nav id="tab-bar">
    <button data-tab="rank" class="active">Rank</button>
    <button data-tab="scenes">Scenes</button>
  </nav>

  <div id="tab-rank">
  <div id="scene-bar">
    <button id="scene-left" class="scene-arrow" title="scroll left">&#8249;</button>
    <div id="scene-strip"></div>
    <button id="scene-right" class="scene-arrow" title="scroll right">&#8250;</button>
  </div>
  <!-- STO-SCN-108: the ranker identity is chosen in the STUDIO title-bar profile menu
       (server-backed) + shared via localStorage; the rank app reads it silently. This
       hidden select keeps the existing rater logic working. -->
  <select id="rater-select" style="display:none"></select>

  <main>
    <section id="grid-pane">
      <!-- STO-SCN-110: header above the main viewport — Layout (left, no label) +
           page-cycle (right, no label, keep X/Y). -->
      <div id="viewport-header">
        <div id="layout-buttons" role="tablist">
          <button data-layout="1" class="active">1</button>
          <button data-layout="2">1×2</button>
          <button data-layout="4">2×2</button>
          <button data-layout="9">3×3</button>
        </div>
        <div class="cycle">
          <button id="prev-page">←</button>
          <span id="page-indicator">1 / 1</span>
          <button id="next-page">→</button>
        </div>
      </div>
      <div id="grid"></div>
      <div id="missing-pool" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; min-height:60px; align-content:flex-start;"></div>
    </section>

    <section id="rank-pane">
      <div id="rank-header">
        <!-- STO-SCN-110: View selector card (replaced the View dropdown + the pane heading) -->
        <div id="view-card"></div>
        <div class="rank-right">
          <div id="view-title">View 0 of 0</div>
          <div class="rank-actions">
            <button id="reset-tiers" title="Move everything back to pool">Reset</button>
            <button id="submit-btn" disabled>Submit ranking</button>
          </div>
        </div>
      </div>

      <div class="tier-row pool-row">
        <div class="tier-label">Pool<br><span class="tier-sub">(drag to rank)</span></div>
        <div class="tier-drop" id="pool-drop" data-tier="pool"></div>
      </div>

      <div id="tiers"></div>

      <div id="submit-status"></div>
    </section>

    <aside id="info-pane">
      <h3>Manifest
        <button id="open-scout" title="Open this variant's mesh + camera spine (utilized subset highlighted) in Scout">🔭 Scout</button>
        <button id="copy-link" title="Copy a deep-link to this rendering">⧉ Link</button>
        <button id="copy-manifest" title="Copy this manifest as Markdown (with a deep-link back)">⧉ MD</button>
      </h3>
      <div id="manifest-content">
        <em>Hover a card to see settings.</em>
      </div>
      <!-- STO-SCN-134: camera subset — which cameras/frames this render was built from -->
      <div id="camera-subset"></div>
      <hr>
      <!-- STO-SCN-134: Live Results collapsible, default collapsed -->
      <details id="results-details">
        <summary><span class="results-summary">Live Results</span></summary>
        <div id="results-content">
          <em>No rankings yet.</em>
        </div>
      </details>
    </aside>
  </main>
  </div><!-- /#tab-rank -->

  <!-- STO-SCN-146: Scenes tab — scene selector header + config area + view switcher.
       Read-views (Metadata 153 / Spine 147 / Subsets 148) mount in #scenes-view.
       New-Scene flow (149–152) hangs off #new-scene-btn. -->
  <section id="tab-scenes" hidden>
    <div id="scenes-bar">
      <button class="scene-arrow" id="sc-left" title="scroll left">&#8249;</button>
      <div id="scenes-strip"></div>
      <button class="scene-arrow" id="sc-right" title="scroll right">&#8250;</button>
      <button id="new-scene-btn" title="Create a new scene (STO-SCN-149)">+ New Scene</button>
    </div>
    <div id="scenes-config">
      <div id="scenes-viewbar" role="tablist">
        <button data-view="meta" class="active">Metadata</button>
        <button data-view="spine">Spine</button>
        <button data-view="subsets">Subsets</button>
      </div>
      <div id="scenes-view"><em>Select a scene above.</em></div>
    </div>
  </section>

  <footer>
    <small>
      <span id="status-msg">Ready.</span>
      &nbsp;|&nbsp;
      Keys: <kbd>1</kbd>–<kbd>9</kbd> grid layout · <kbd>←</kbd>/<kbd>→</kbd> page · <kbd>r</kbd> reset · <kbd>Enter</kbd> submit
    </small>
  </footer>

  <script src="/static/app.js"></script>
  <script src="/static/scenes.js"></script>
  <script src="/static/scenes-meta.js"></script>
</body>
</html>
