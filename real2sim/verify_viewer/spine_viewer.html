<!DOCTYPE html><html><head><meta charset="utf-8">
<title>STO-SCN-100 whole-spine verify — assembled gaussian + seams + trajectory</title>
<style>
 body{margin:0;overflow:hidden;background:#0e0e11;font-family:monospace}
 #hud{position:absolute;top:8px;left:8px;color:#ddd;background:#000b;padding:8px 10px;
      border:1px solid #444;font-size:12px;line-height:1.7;z-index:10;max-width:46ch}
 #hud b{color:#7cf}
 #hud input[type=range]{vertical-align:middle;width:96px}
 #seams{position:absolute;top:8px;right:8px;color:#ddd;background:#000b;padding:8px 10px;
        border:1px solid #444;font-size:12px;line-height:1.6;z-index:10}
 #seams b{color:#7cf} .ok{color:#3f6} .bad{color:#f55}
 #s{position:absolute;bottom:8px;left:8px;color:#fc6;background:#000b;padding:6px 10px;font-size:12px;z-index:10}
 .swatch{display:inline-block;width:10px;height:10px;margin-right:4px;border:1px solid #666}
</style></head>
<body>
<div id="hud"><b id="title">100 whole-spine verify</b><br>
  <span id="legend"></span><br>
  <b>trajectory</b> = global camera path · <b>seam frames</b> = white ·
  doubled walls / drift gaps / misaligned seams are the defects to spot<br>
  gaussians <input id="gop" type="range" min="0" max="1" step="0.05" value="1">
  frustums <input id="fop" type="range" min="0" max="1" step="0.05" value="0.5">
  trajectory <input id="top" type="range" min="0" max="1" step="0.05" value="0.9"><br>
  <b>mouse</b>=orbit/zoom/pan · <b>arrows</b>=rotate · <b>1-6</b>=snap up · <b>0</b>=cam-up · <b>S</b>=toggle seams-only</div>
<div id="seams"><b>seams (098 residuals)</b><br><span id="seamlist">…</span></div>
<div id="s">loading…</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js" }}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as GS from '@mkkellogg/gaussian-splats-3d';

const CB = '?v=' + Date.now() + '-' + Math.random().toString(36).slice(2);   // unique per load
const d = await (await fetch('./spine.json' + CB, {cache:'no-store'})).json();
const up = d.up || [0,-1,0];
const ctr = d.scene_ctr || [0,0,0];
const sr = d.scene_radius || 5;
const C = new THREE.Vector3(...ctr);
const FR = d.frustums, TRAJ = d.trajectory || [], SEAMS = d.seams || [];
const NSEG = d.n_segments || 1;
const gop=document.getElementById('gop'), fop=document.getElementById('fop'), top_=document.getElementById('top');

// distinct per-segment colors (cohesion is judged by whether adjacent colors line up
// seamlessly — a misaligned seam shows a colour step / doubled wall).
const PALETTE = [0x33a0ff,0x33ff66,0xffcc33,0xff5599,0xaa66ff,0x44ddcc,0xff8844,0x99dd33];
const segColor = i => PALETTE[i % PALETTE.length];

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, sr*0.005, sr*15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(C); controls.enableDamping = true; controls.dampingFactor = 0.12;

const ov = new THREE.Scene();
const axes = new THREE.AxesHelper(sr*1.3); axes.position.copy(C); ov.add(axes);
let grid = null;

function frame(upArr){
  camera.fov = 50;
  const U = new THREE.Vector3(...upArr).normalize();
  let H = new THREE.Vector3(Math.abs(U.x) > 0.9 ? 0 : 1, 0, Math.abs(U.x) > 0.9 ? 1 : 0);
  H.crossVectors(U, H).normalize();
  camera.up.copy(U);
  camera.position.copy(C).addScaledVector(U, sr*0.9).addScaledVector(H, sr*1.9);
  controls.target.copy(C); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  controls.update();
  if (grid) ov.remove(grid);
  grid = new THREE.GridHelper(sr*4, 16, 0x44ccaa, 0x225544);
  grid.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), U);
  grid.position.copy(C); ov.add(grid);
}
const AX={Digit1:[1,0,0],Digit2:[-1,0,0],Digit3:[0,1,0],Digit4:[0,-1,0],
          Digit5:[0,0,1],Digit6:[0,0,-1],Digit0:up};
function rotateView(dAz,dEl){
  const off=camera.position.clone().sub(controls.target), U=camera.up.clone().normalize();
  off.applyAxisAngle(U,dAz);
  const right=new THREE.Vector3().crossVectors(off,U).normalize();
  off.applyAxisAngle(right,dEl);
  camera.position.copy(controls.target).add(off); controls.update();
}
let seamsOnly=false;
addEventListener('keydown', e=>{
  if (AX[e.code]) { frame(AX[e.code]); return; }
  const s=0.1;
  if (e.code==='ArrowLeft') rotateView(s,0); else if (e.code==='ArrowRight') rotateView(-s,0);
  else if (e.code==='ArrowUp') rotateView(0,s); else if (e.code==='ArrowDown') rotateView(0,-s);
  else if (e.code==='KeyS'){ seamsOnly=!seamsOnly; applyFrustumVis(); }
});
frame(up);
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });

// ── trajectory polyline (global camera path, ordered) coloured per segment ──
const matTraj = new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:+top_.value});
if (TRAJ.length > 1){
  const pts=[], col=[];
  for (let i=0;i<TRAJ.length-1;i++){
    const a=TRAJ[i], b=TRAJ[i+1];
    pts.push(new THREE.Vector3(a[0],a[1],a[2]), new THREE.Vector3(b[0],b[1],b[2]));
    const c=new THREE.Color(segColor(a[3]||0)); col.push(c.r,c.g,c.b,c.r,c.g,c.b);
  }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  ov.add(new THREE.LineSegments(g, matTraj));
}
top_.oninput=()=>{ matTraj.opacity=+top_.value; matTraj.visible=+top_.value>0; };

// ── frustums coloured by segment; seam (shared) frames in white ──
const segMats = Array.from({length:NSEG}, (_,i)=>
  new THREE.LineBasicMaterial({color:segColor(i), transparent:true, opacity:+fop.value}));
const matSeam = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:Math.min(1,+fop.value+0.3)});
const ha = Math.tan(22*Math.PI/180);
const frustumObjs=[];
for (const f of FR){
  const R=f.R, p=new THREE.Vector3(...f.pos);
  const dep = f.seam ? 0.32 : 0.20;
  const right=new THREE.Vector3(R[0],R[3],R[6]), down=new THREE.Vector3(R[1],R[4],R[7]),
        fwd=new THREE.Vector3(R[2],R[5],R[8]);
  const cF=p.clone().add(fwd.clone().multiplyScalar(dep));
  const hw=dep*ha, hh=dep*ha*0.66;
  const cor=[[1,1],[1,-1],[-1,-1],[-1,1]].map(([sx,sy])=>
    cF.clone().add(right.clone().multiplyScalar(sx*hw)).add(down.clone().multiplyScalar(sy*hh)));
  const pts=[]; for(let i=0;i<4;i++){pts.push(p,cor[i]); pts.push(cor[i],cor[(i+1)%4]);}
  const mat = f.seam ? matSeam : segMats[(f.seg||0) % NSEG];
  const obj = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), mat);
  obj.userData.seam = !!f.seam; ov.add(obj); frustumObjs.push(obj);
}
function applyFrustumVis(){ for(const o of frustumObjs) o.visible = (!seamsOnly || o.userData.seam); }
fop.oninput=()=>{ segMats.forEach(m=>{m.opacity=+fop.value; m.visible=+fop.value>0;});
                  matSeam.opacity=Math.min(1,+fop.value+0.3); matSeam.visible=+fop.value>0; };

// legend + seam list
document.getElementById('title').textContent = d.title || '100 whole-spine verify';
document.getElementById('legend').innerHTML =
  Array.from({length:NSEG},(_,i)=>`<span class="swatch" style="background:#${segColor(i).toString(16).padStart(6,'0')}"></span>seg ${i}`).join(' ') +
  ' <span class="swatch" style="background:#fff"></span>seam';
document.getElementById('seamlist').innerHTML = SEAMS.length ? SEAMS.map(s=>{
  const pct=(s.residual_rel*100).toFixed(2), cls=s.registrable?'ok':'bad';
  return `${s.i}↔${s.j} <span class="${cls}">${pct}%</span> (cf ${(s.consensus_frac*100|0)}%${s.n_outlier?`, ${s.n_outlier} out`:''})`;
}).join('<br>') : 'M=1 — single space, no seams';

// ── assembled gaussian (already in the global gauge — identity transform) ──
const viewer = new GS.Viewer({renderer, camera, selfDrivenMode:false,
  useBuiltInControls:false, cameraUp:up, dynamicScene:true, sharedMemoryForWorkers:false});
try {
  await viewer.addSplatScene('./fused.gs.ply' + CB, {format:GS.SceneFormat.Ply, showLoadingUI:false});
  const sscene = viewer.getSplatScene && viewer.getSplatScene(0);
  if (sscene){ gop.oninput=()=>{ sscene.opacity=+gop.value; viewer.getSplatMesh().updateTransforms(); }; }
  document.getElementById('s').textContent =
    `assembled spine: ${NSEG} segment(s), ${FR.length} cameras, ${SEAMS.length} seam(s) — ` +
    `confirm cohesion or flag a seam (T-020)`;
} catch(e){ document.getElementById('s').textContent='ERR: '+e; }

// proven two-pass: splats (autoclear on) then overlay (autoclear off)
function loop(){
  requestAnimationFrame(loop); controls.update();
  renderer.autoClear=true; viewer.update(); viewer.render();
  renderer.autoClear=false; renderer.render(ov, camera); renderer.autoClear=true;
}
loop();
</script></body></html>
