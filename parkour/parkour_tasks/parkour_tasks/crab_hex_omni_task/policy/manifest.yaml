    title: Gates K1-K6 per head
    what: 'closed-loop gates K1-K6 (PLAN H7, CHARTER 3 rulings), read by scripts/sh_read.py --spec head_<NAME>_spec.json
      into head_<NAME>.{md,json} against the step-4b control table (step4b_read.{md,json}: 14 / 14 cells land, 0
