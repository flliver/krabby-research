# POLICY OF RECORD for the crab-hexapod OMNIDIRECTIONAL walk task (phase 1) -- the head that ships
# (`current`) and the stage heads it was trained through, in training order. Consumed by
# experiments/tools/bundle_policy.py (--sync / --check) and tests/unit/test_policy_of_record_omni.py.
# Changes only on a user bake decision: edit here, --sync, commit.
# Schema = the forward task's policy/manifest.yaml adapted: every stage is a phase-1a stage on the
# KRABBY_OMNI_PHASE=1a preset plus a per-stage overlay from a campaign's candidates.yaml (`stage`,
# `overlay_ref`); there are NO omni presets for these overlays -- the bake added none and moved no
# config / mdp code. Evals are the per-category suite (`suite__omni`, 100 episodes per category,
# paired categories pooled over both hands; read with experiments/tools/run_phases.summarize(
# json(scenario_metrics.json)["aggregate"])["cat"]). sha256 of every stage file and of every eval
# stamp's run_meta.checkpoint_sha256 verified by hand on 2026-09-25 when this file was created.
