      and the nine zero-command rows (K5 = the predecessor''s sn_calib G1-G5 at 1.064, unchanged reads and lines: suite /
      walkstop es1-2, field_hard es1-4, field_turn es1). Cells es1 / es2 (K5 one verdict over both); — (null in the
      manifest) = the role is not read on that gate; inf = never reached. K1 worst of 5 height bins over [0.719, 1.346]
      m; K6 lines per bin (R_h''s share in that bin - max(5 pp, 2 SE)). Every head read exits 4 on R_h''s own accepted
      es1 0.635 hip-contact floor events (REPORT 3 notes), not on a head'
    stamps_root: parkour/outputs/omni_plan/phase2/lr/<NAME>/<row>/seed00<k>/<stamp>
    references:
      # step4b_read.{md,json} control table (expected / observed / lands); R_h's table cells from sh_table/2026-10-13_21-59-02_full
