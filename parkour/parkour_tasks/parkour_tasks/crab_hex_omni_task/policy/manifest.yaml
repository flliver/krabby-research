      posture: 'SH_POST -- the posture map q(h_lim) alone (zero residual): must fail K6 (never homes); passes K1-K3, reported'
      A-mask s17 + q: 'the superseded net through the new q path (step-4b roles Amask_q / Amask on its height rows
        SH_AMq), reported only, not a column here: FAILS K1 (worst median 87.5 / 87.9 mm), K2 (never reached), K3 (0.13 /
        0.162 STOOD) and K6 (homed 0 in four of five bins, 0.81 / 0.71 steps per s), passes K4 -- it cannot stand away
        from 1.064. Its K5 cell is NOT the q path: step 4b''s K5 role Amask is the predecessor''s own SN_Amask_s17
        zero-command rows, the second known-good K5 control of the step-4b table (expected PASS, observed PASS, lands)'
    gate_table:
      columns:
      - {id: R_h, label: 'R_h (known-good)'}
      - {id: R_old, label: 'R, old +-1 path'}
      - {id: Amask_old, label: 'A-mask s17, old +-1 path'}
      - {id: S1, label: 'S1 alone'}
      - {id: no_restore, label: 'no restore'}
      - {id: posture, label: 'posture only'}
      - {id: SH_T18, label: 'SH_T18'}
      - {id: SH_T16, label: 'SH_T16'}
      - {id: SH_T17, label: 'SH_T17 (adopted)'}
      rows:
      - {key: k1_median, gate: K1, stat: 'worst-bin median |h - h_cmd| (mm), 5 bins',
