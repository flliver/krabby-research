# POLICY OF RECORD for the crab-hexapod OMNIDIRECTIONAL walk task (phases 1 + 2) -- the head that ships
# (`current`) and the stage heads it was trained through, in training order. Consumed by
# experiments/tools/bundle_policy.py (--sync / --check) and tests/unit/test_policy_of_record_omni.py.
# Changes only on a user bake decision: edit here, --sync, commit.
# Schema = the forward task's policy/manifest.yaml adapted: every stage is a KRABBY_OMNI_PHASE preset
# (`phase`: 1b for the from-scratch side-first stage 1_fb6k, 1a for c4..c6x, 2a for the phase-2 field stage)
# plus a per-stage overlay from a campaign's candidates.yaml (`stage`, `overlay_ref`); there are NO omni
# presets for these overlays -- neither bake added one or moved config / mdp / PPO code (2026-10-06: code_sha
# f7166d558c5d8d9b / eval_sha 1d021625844bb372 unchanged; 2026-10-08: code_sha e3fe70fbdd6445c8 / eval_sha
# 1d021625844bb372 unchanged). The B construction knobs are runner-side env overlays, default-off in
# config/crab_hex/motion_knobs.py (`construction:` below; not rendered by the tool). Suite evals are the
# per-category suite (`suite__omni`, 100 episodes per category, paired categories pooled over both hands;
# read with experiments/tools/run_phases.summarize(json(scenario_metrics.json)["aggregate"])["cat"]); the
# phase-2 stage also carries its obstacle rows (`evals.rows`, the campaign's scenarios_p2.yaml 8-hold rows,
# schedule_completion_rate). sha256 of every stage file and of every eval stamp's
# run_meta.checkpoint_sha256 verified read-only when each stage was added (stages 1-5 2026-10-06, stage 6
# 2026-10-08).
# 2026-10-06 bake: replaces W (baked 2026-09-25, `superseded:` below -- its files left this folder at
# this bake and stay in git history).
# 2026-10-08 bake: adds the phase-2 stage 6_p2a_field (P2__S1_s18, same seed-18 lineage) and makes it the
# head of record; stages 1-5 are unchanged and 5_c6x_clockfree stays the phase-1 head (`heads:`).
# 2026-10-13 adoption: adds the STAND NETWORK of record (`stand_network:` below, folder stand_net/, `heads.stand`) --
# A-mask s17 (SN_Amask_s17 model_4000, experiments/2026-10-11_stand_network), a second policy the controller routes
# on stand holds beside the walking head 6_p2a_field. It is NOT a lineage stage and NOT a training asset; stages 1-6,
# `current` and the walking head of record are unchanged.
task: crab_hex_omni_task
plant: A15+B
seed: 18
current: 6_p2a_field
heads:
  # data only: the head of record per phase (the tool ships `current`); `stand` names the stand_network block's dir
  phase1: 5_c6x_clockfree
  phase2: 6_p2a_field
  stand: stand_net
baked: '2026-10-08 (user decision, CHARTER 9 of experiments/2026-10-07_omni_phase2: bake S1 s18 = chain
  P2__S1_s18 as the omni PHASE-2 head of record, stage 6_p2a_field, after the S1 s16-vs-s18 breakdown; stages
  1-5 unchanged, same seed-18 lineage. Selection: CHARTER 7 rule stated before judging (floors PASS-or-COST as a
  gate -> obstacle rank-sum -> phase-1 whole-task rank-sum if within 2 -> jitter / stand stepping -> turn band);
  three judges + a fable check unanimous S1 s18 > S1 s16 > A1 s18 > S1 s17 (obstacle rank-sum 6.5 / 10.0 / 11.5
  / 12.0, judging_result.json). Robustness FRAGILE: the lead comes from near-ceiling rows; field_hard ties at
  n=400 (s18 0.8125 vs s16 0.815) and a tie-aware reading would pick S1 s16 (which would need a stages 1-5
  re-bake on the weaker s16 phase-1 line); the user chose s18 on gait / move_turn / lineage. p2b (CHARTER 10)
  closed with no lever adopted, so the candidates stayed the S1 p2a heads). PREVIOUSLY 2026-10-06 (phase 1 --
  user decision: bake the side-first B recipe of experiments/2026-10-01_ppo_construction
  as the omni phase-1 recipe of record, and make the best side-first B head the head of record, replacing W;
  head = SF__B_rest_s18 (seed 18) chosen among the three B seeds 16 / 17 / 18 by the rule stated before
  judging: floors, then the whole task, then motion quality and the turn band as tie-breakers -- runner-up
  SF__B_rest_s16, third SF__B_rest_s17. The C0 side-first control is n=1 and descriptive (SF__C0_rest_s16 only;
  s17 / s18 cancelled by the user), so CHARTER 13.4''s final gate was not applied)'
recipe: 'SIDE-FIRST B, 15000 iterations. Stage 1 from scratch on base preset KRABBY_OMNI_PHASE=1b + the
  FB6k__B overlay (the FB pool stand / fwd / side_l / side_r / back 0.2 each, KRABBY_OMNI_SLOTS 0.2:0.8:0:0,
  KRABBY_OMNI_DIR_BAND empty -- no turn yet); then base preset KRABBY_OMNI_PHASE=1a + the P1 c4 -> c5 -> c6
  -> c6x overlays (the C1d pools: +turn / move_turn, +omni, +omni_turn), each named by its stage''s
  overlay_ref, in stage order; c6x adds the removal set K (KRABBY_CLOCK_W=0.001, KRABBY_APEX_W=0.001,
  KRABBY_OMNI_CLOCK_HIDE=1). EVERY stage also carries the B construction knobs KRABBY_ACTION_BOUND_LOSS=0.001,
  KRABBY_ACTION_BOUND_RAMP=0.0001:0.001:500, KRABBY_ACTION_BOUND=1.1, KRABBY_STD_PARAM=soft,
  KRABBY_INIT_STD=0.8, KRABBY_ENTROPY_COEF=0.0025, KRABBY_ACTION_RATE_W=0, plus KRABBY_OMNI_MIRROR_IMAGES=fa,
  KRABBY_RSI_FRAC=0, KRABBY_OMNI_SPEED_ELLIPSE=0.35:0.35:0.25 and KRABBY_PPO_HAND_DIAG=1 (diagnostic only).
  All of it is env overlay recorded in experiments/2026-10-01_ppo_construction/candidates.yaml (==
  scripts/candidates_v7.yaml) -- no preset or default encodes it. The clock reward weights stay at eps 0.001
  exactly as trained (not 0). Side-first reverses the adopted C1d turn-first order (CHARTER 13.4 caveat).
  PHASE 2 (stage 6_p2a_field, 15000 -> 20000): base preset KRABBY_OMNI_PHASE=2a (task
  Isaac-Crab-Hex-Omni-Teacher-v0; curriculum on, the 2a DR, collision / edge / stumble terms, 40-s episodes) +
  the P2__S1_s18 p2a overlay verbatim (experiments/2026-10-07_omni_phase2/candidates.yaml), forked by
  checkpoint from the c6x head: the c6x pool / slots / clock removal set and every B construction knob EXCEPT
  KRABBY_ACTION_RATE_W=-0.05 (the S1 sibling knob; phase 1 trained 0), plus KRABBY_PHASEOUT="" (no clock /
  satellite ramps), KRABBY_OMNI_FACING=0.2:1.2 and the wall field: KRABBY_FLAT_TERRAIN_GEOM=field,
  KRABBY_FIELD_PAD_R=1.7, KRABBY_FIELD_BLOCKS=14:28, KRABBY_FIELD_KINDS=0.4:0.4:0.2 (bar:slab:pit),
  KRABBY_FIELD_EDGES=wall, KRABBY_FLAT_TERRAIN_DIFF=0.20:1.0, KRABBY_TERRAIN_PROMOTE=0.7:0.4 (calibrated on
  P2__CALW1_s18, r-bar 0.798).'
construction:
  # Data only (bundle_policy.py does not read or render it). The B arm (CHARTER 2: A + action_rate 0), identical
  # in the five phase-1 stages' overlays and in each run dir's params/agent.yaml; the phase-2 stage carries it
  # too except the keys in its own `construction_delta` (KRABBY_ACTION_RATE_W -0.05, the S1 knob). Only
  # STD_PARAM / INIT_STD shape the POLICY (they are carried into eval / play, obs_contract.eval_env.carry); the
  # rest shape the TRAINER only.
  ppo:
    KRABBY_ACTION_BOUND_LOSS: '0.001'
    KRABBY_ACTION_BOUND_RAMP: '0.0001:0.001:500'
    KRABBY_ACTION_BOUND: '1.1'
    KRABBY_STD_PARAM: soft
    KRABBY_INIT_STD: '0.8'
    KRABBY_ENTROPY_COEF: '0.0025'
    KRABBY_ACTION_RATE_W: '0'
  every_stage:
    KRABBY_OMNI_MIRROR_IMAGES: fa
    KRABBY_RSI_FRAC: '0'
    KRABBY_OMNI_SPEED_ELLIPSE: '0.35:0.35:0.25'
    KRABBY_PPO_HAND_DIAG: '1'
  runner_fixed: 'clip_actions 1.0 (runner cfg, not an env knob); 256 envs; the PPO-counter resume fix (eabe7324) on
    this branch: every resume carries priv_reg (OUT/arms_p1/SF__B_*_s18_resume.json; phase 2:
    parkour/outputs/omni_plan/phase2/arms/P2__S1_s18_resume.json)'
assets:
- dir: rsi
  file: rsi_bank_omni.npz
  source: parkour/parkour_tasks/parkour_tasks/crab_hex_omni_task/experiments/2026-09-16_1805_omni_formation/rsi_bank_omni.npz
  sha256: 98ce8420192efcbf24c37c07fa521c91e00a264d54ecb1d73b41b1d9901c46c6
  what: omni RSI reference-state bank -- forward frames (the forward 2c teacher, source 0) merged with sideways
    frames (the sideways 2a teacher, source 1), 2000 each, provenance-tagged (sha256 pinned in that campaign's
    bundle.yaml; harvest recipe in its RSI_BANK.md)
  used_by: every omni preset via KRABBY_RSI_BANK (config/crab_hex/crab_hex_omni_phases.py:132 OMNI_BANK,
    :153 OMNI_COMMON) at KRABBY_RSI_FRAC=0.2 (the forward FORMATION value, inherited); which frames a stage
    draws is KRABBY_OMNI_RSI_SOURCE. The presets still read it from its experiments/ source path. The CURRENT
    lineage (side-first B) drew NO frames from it -- every stage's overlay sets KRABBY_RSI_FRAC=0 (RSI off);
    it stays bundled because every omni preset still names it (and W's lineage, superseded, used it)
  notes: backward travel has no RSI seed (rotating a stored frame never yields backward momentum); the bank's
    frames carry a gait-clock phase
obs_contract:
  width: 1149
  clock_columns: 'the gait clock sin/cos = obs dims 15-16 of the per-step proprio head plus the same two dims in
    each of the 10 history copies (history_length 10, config/crab_hex/crab_hex_omni_env_cfg.py:108) = 22 columns;
    the critic reads the same obs_buf. Re-verified for this lineage: obs_dim_actual 1149 in every B suite stamp''s
    run_meta, and the B checkpoints'' model_state_dict has the same keys / shapes as W''s except std_raw (18) in
    place of std (18). Phase 2 (2026-10-08): the 6_p2a_field checkpoint has exactly the c6x head''s keys and
    shapes (critic.0.weight 512 x 1149, std_raw only) and obs_dim_actual 1149 in every p2a / REF stamp -- the
    policy observation contract is unchanged by phase 2 (the 2a teacher task adds no policy input)'
  hide_knob: KRABBY_OMNI_CLOCK_HIDE
  refs: config/crab_hex/clock_knobs.py (KRABBY_OMNI_CLOCK_HIDE=1 -> obs term params["clock_hide"]; width-preserving;
    EVAL_SEMANTIC_KNOBS), mdp/crab_hex_omni_observations.py (CrabHexOmniParkourObservations._clock_channels /
    _hide_clock -> exact (0, 0) on every row), experiments/tools/run_phases.py EVAL_CARRY / EVAL_CARRY_DEFAULTS;
    config/crab_hex/motion_knobs.py apply_exploration_knobs (KRABBY_STD_PARAM=soft -> policy.noise_std_type
    "soft", KRABBY_INIT_STD -> init_noise_std) and parkour/scripts/rsl_rl/modules/crab_actor_critic_with_encoder.py
    _build_noise_std (std_raw for soft, scalar std otherwise; the checkpoint loads strict=True)
  hazard: 'run_phases.EVAL_CARRY carries the eval_env below (and the per-stage KRABBY_OMNI_CLOCK_HIDE) into DRIVER
    evals only. scripts/rsl_rl/play.py, scripts/eval_crab_hex_gait.py run by hand, and any exported jit / onnx
    policy set NONE of it -- export the whole carry block. LOUD if missing -- KRABBY_STD_PARAM=soft: every stage
    here trained the tanh-bounded soft std (parameter std_raw); a B head played or evaluated without it builds a
    scalar std and the strict checkpoint load raises RuntimeError (missing "std", unexpected "std_raw"); the
    same error, mirrored, means a scalar-std head (W) was built soft. KRABBY_INIT_STD=0.8 only initialises that
    parameter before the load overwrites it (carried for fidelity; values >= 2.0 are refused); actions are the
    mean (act_inference), so the std never changes play / eval actions. KRABBY_FLAT_TERRAIN_GEOM=ring is also
    loud (require_ring_geom raises). SILENT if missing -- KRABBY_OMNI_CLOCK_HIDE=1 for the current head (else a
    clock-free head is fed a live clock it never trained on); KRABBY_OMNI_FACING_OBS_CLIP=0.6 (the obs term''s
    class default is no clip); KRABBY_OMNI_SPEED_ELLIPSE=0.35:0.35:0.25 (this lineage trained a 0.35 m/s
    lateral semi-axis; the class / preset value 0.35:0.25:0.25 -- W''s -- re-caps every lateral command at 0.25
    m/s with no error). run_meta.speed_ellipse in an eval stamp is the EVAL MANIFEST''s validator ellipse
    (scenarios_omni.yaml), not this knob -- read run_meta.env_vars.'
  eval_env:
    # exactly the env_vars of the c6x head's suite__omni run_meta.json (seed18_X60_c6x_A15pB 2026-10-06_07-56-23)
    # minus KRABBY_OMNI_CLOCK_HIDE, which is per stage (below); the phase-2 head's driver suite stamp
    # (seed18_X08_p2a_A15pB 2026-10-07_13-54-14) carries the SAME 26 keys and values, re-verified 2026-10-08. Identical (26 keys) on every suite, turn-band and
    # side22_25lr stamp of this lineage apart from KRABBY_OMNI_CLOCK_HIDE. EVAL_CARRY keys = the semantics the heads
    # trained under; the rest are the driver's fixed eval block. Differs from W's block in exactly three keys:
    # KRABBY_OMNI_SPEED_ELLIPSE (W 0.35:0.25:0.25), KRABBY_STD_PARAM (W '0' = scalar std), KRABBY_INIT_STD (W '0').
    carry:
      KRABBY_OMNI_FACING_OBS_CLIP: '0.6'
      KRABBY_OMNI_SPEED_ELLIPSE: '0.35:0.35:0.25'
      KRABBY_OMNI_ANG_VEL_MAX: '0.3'
      KRABBY_OMNI_CLOCK_TURN_R: '1.2'
      KRABBY_OMNI_YAW_RANGE: '-3.14159:3.14159'
      KRABBY_OMNI_FACING_OBS_ENCODING: raw
      KRABBY_OMNI_ANG_VEL_CLIP: '0.2'
      KRABBY_OMNI_RELAY_HYST: '0'
      KRABBY_OMNI_STAND_HOLD: '0'
      KRABBY_OMNI_STAND_PARK: '0'
      KRABBY_ACTION_LPF_HZ: '0'
      KRABBY_ACTION_LPF_OBS: '0'
      KRABBY_OMNI_STAND_OBS: '0'
      # every stage here trained with KRABBY_OMNI_CMD_OBS unset (= off, '0')
      KRABBY_OMNI_CMD_OBS: '0'
      # policy STRUCTURE (PPO-construction plan step 2): every stage here trained the soft std at init 0.8
      KRABBY_STD_PARAM: soft
      KRABBY_INIT_STD: '0.8'
    fixed:
      KRABBY_FLAT_TERRAIN_GEOM: ring
      KRABBY_RSI_FRAC: '0'
      KRABBY_PLAY_DEBUG_VIS: '0'
      KRABBY_PLANT: A15+B
      KRABBY_LIN_VEL_X: '0.0:0.35'
      KRABBY_TRACK_SIGMA2: '0.1'
      KRABBY_TRACK_L1_W: '-1.0'
      KRABBY_CLOCK_W: '1.0'
      KRABBY_APEX_W: '1.0'
    fixed_notes: KRABBY_FLAT_TERRAIN_GEOM=ring is REQUIRED by every omni process (apply_omni_ring_knobs); the
      LIN_VEL_X / TRACK_* / CLOCK_W / APEX_W keys are the driver's fixed FORMATION reward frame (CANARY_KEYS) --
      reward-only in an eval, they do not reach the policy (CLOCK_W 1.0 at eval does NOT show the clock; only
      KRABBY_OMNI_CLOCK_HIDE decides that). The B construction knobs other than STD_PARAM / INIT_STD (bound loss,
      ramp, bound, entropy, action_rate, mirror images, hand diag) and the sampler / reward overlay keys are
      training-only and are NOT carried (run_phases.py EVAL_CARRY block)
