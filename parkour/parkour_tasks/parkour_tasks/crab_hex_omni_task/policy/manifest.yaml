- id: stand_switch_keying
  recorded: '2026-10-13 (stand network adoption); revised 2026-10-15 (SH_T17 adopted)'
  headline: The evaluated stand switch keys on a latched slot that keeps "turning" after a facing change.
  detail: 'STILL OPEN with SH_T17 (2026-10-15): the stand-height launcher (sh_eval_crab_hex_gait.py, "the latched slot
    as P2L") and its video recorder (sh_record_video.py, routing rule "the eval''s latched stand slot | H6 restore")
    route on the same latched slot; the height rows hold one facing per row (sh_eval_common.height_row) and the K5 rows
    are the predecessor''s, so no K1-K6 row puts a stand after a facing change either. The H6 restore engages on that
    slot''s stand -> non-stand edge (sh_core.HeightController.step), so the explicit stand command must drive the
    restore edge too. ORIGINAL FINDING (A-mask s17, 2026-10-13): the gates routed the stand net on the eval command
    term''s LATCHED stand slot. That latch re-arms only on a fresh facing target or a reset, so after any facing change
    it keeps reading TURN through later same-face moves and stands: on the 2026-10-13 random 180-s schedule (9
    commands, 10 stands) it read TURN on 7 of the 10 stands -- under the evaluated contract S1 would have marched
    through them. No gate row puts a stand after a facing change (suite / walkstop / field rows reset or walk straight
    first), so G1-G5 never saw it. The video routed by the schedule''s explicit stand holds (speed 0, no facing
    change): 0 falls, 0 route mismatches, stand-net share 1.0 on every stand, 9 / 10 stands homed at their end (the
    3.9-s stand ended before homing).'
