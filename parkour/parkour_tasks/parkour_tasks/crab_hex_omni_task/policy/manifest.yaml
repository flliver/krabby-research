followups:
- id: move_turn
  recorded: '2026-09-25 (user decision to bake W with this open)'
  headline: Nobody actually turns during move_turn.
  detail: 'W move_turn survival 0.365 vs the clock-held twin X0x s3 0.865 (floor 0.545; D05 overruled); move_turn speed
    ratio 0.442 vs 0.521. Failure mode: a slow forward nose-dive -- the front pair (FL, FR) lift together, pitch builds
    ~0.05 -> 0.17 rad over the hold, the middle legs unload, tilt termination (125/127 pitch_fwd, both hands alike);
    penalty_base_pitch_forward_linear sits at weight 0 in c6x. The same failure grows with clock-free training in
    wave 1 (move_turn survival A3000 0.19, A4500 0.59, A6000 0.73). "Nobody actually turns during move_turn": every
    omni head, clock-held or not (W, X0x, X0 s3 c6, A4500, A3000, E10), reaches only 0.02-0.07 rad/s against the
    0.3 rad/s commanded; heading error at hold end 1.1-1.5 rad -- the hold is effectively 12 s of translation with an
    unclosed yaw error.'
  evidence:
  - experiments/2026-09-23_clock_deprecation_w2/MOVE_TURN_MECHANISM.md
  - experiments/2026-09-23_clock_deprecation_w2/WAVE2_METRICS.md
  levers: 'untested: re-enable / extend the forward-pitch penalty to move-turn commands; a front-pair support term;
    move_turn curriculum / weighting; examine why the turn-rate command is not tracked while translating (command
    math / reward kernels) -- offline replay gate first'
- id: seed2_confirm_waived
  recorded: '2026-09-25'
  headline: W is seed 3 only.
  detail: The plan's formation-seed-2 confirm (7.65 GPU-h) was waived by the user on 2026-09-25.
- id: phase2_clock_free
  recorded: '2026-09-25'
  headline: No clock-free phase-2 presets yet.
  detail: Omni 2a / 2b / 2c presets resume 1c, re-arm apex via KRABBY_PHASEOUT and show the clock again; forking W into
    them needs clock-free phase-2 presets (open).
