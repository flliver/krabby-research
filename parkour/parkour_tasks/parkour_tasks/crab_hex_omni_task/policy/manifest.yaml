# POLICY OF RECORD for the crab-hexapod OMNIDIRECTIONAL walk task (phase 1) -- the head that ships
# (`current`) and the stage heads it was trained through, in training order. Consumed by
# experiments/tools/bundle_policy.py (--sync / --check) and tests/unit/test_policy_of_record_omni.py.
# Changes only on a user bake decision: edit here, --sync, commit.
# Schema = the forward task's policy/manifest.yaml adapted: every stage is a KRABBY_OMNI_PHASE preset
# (`phase`: 1b for the from-scratch side-first stage 1_fb6k, 1a for the rest) plus a per-stage overlay
# from a campaign's candidates.yaml (`stage`, `overlay_ref`); there are NO omni presets for these
# overlays -- the bake added none and moved no config / mdp / PPO code (code_sha f7166d558c5d8d9b and
# eval_sha 1d021625844bb372 are unchanged by it). The B construction knobs are runner-side env
# overlays, default-off in config/crab_hex/motion_knobs.py (`construction:` below; not rendered by the
# tool). Evals are the per-category suite (`suite__omni`, 100 episodes per category, paired categories
# pooled over both hands; read with experiments/tools/run_phases.summarize(
# json(scenario_metrics.json)["aggregate"])["cat"]). sha256 of every stage file and of every eval
# stamp's run_meta.checkpoint_sha256 verified read-only on 2026-10-06 when this file was drafted.
# 2026-10-06 bake: replaces W (baked 2026-09-25, `superseded:` below -- its files left this folder at
# this bake and stay in git history).
task: crab_hex_omni_task
