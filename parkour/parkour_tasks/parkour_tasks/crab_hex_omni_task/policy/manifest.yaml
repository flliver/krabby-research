    # rsi asset stays bundled because every omni preset still names it; this file stays because the recipe of record
    # (and the trainer that reproduces it) still names it. Never routed by the deployment contract
    id: SN_Amask_s17
    file: model_4000.pt
    sha256: 769cf25331402afdfb23756100ec7c215dacf984a321e90a7b39d2969e4941ff
    source: parkour/outputs/omni_plan/stand_network/runs/SN_Amask_s17/model_4000.pt
    role: 'warm-start ancestor of SH_T17 (W[:, 15] zeroed at load); kept bundled so the adopted head is reproducible and
      the stand-height trainer runs; NOT the stand network of record'
    used_by: 'Named at this path by SH_T17''s checkpoint (infos.sh_dagger.warm_start: this path, this sha256, iter
      4000), by experiments/2026-10-13_stand_height/scripts/sh_core.py STAND_NET_CKPT / STAND_NET_SHA256 (the warm start
      sh_dagger.py refuses to train without), sh_table_test.py (--stand-ckpt default), sh_eval_common.py (--sh-controller
      amask_old, the step-4b known-bad control), the closed predecessor''s sn_table_test.py DEFAULT_STAND, and the
      campaign unit tests (tests/unit/test_sh_dagger_loop.py::test_warm_start_refuses_a_wrong_sha among them). The same
      bytes A-mask s17 was adopted with on 2026-10-13 (4f3019b2), never moved'
  walker:
    # the walking head this stand net was trained beside and evaluated with (infos.sh_dagger.s1_sha256); it must stay a
    # stage of this manifest with exactly this sha, or the pairing is unverified
    stage: 6_p2a_field
    sha256: 968cc550989919cdc3fa36ae047379febabee5659cde0ed4d099195acb13c23c
    note: 'S1 s18 (P2__S1_s18 p2a model_19994), the walking head of record, UNCHANGED by this adoption (and by the
      2026-10-13 one). The stand-height nets were never run beside any other walker (S1 s16 / s17, an earlier stage)'
  architecture:
    class: CrabHexActorCriticRMA (parkour/scripts/rsl_rl/modules/crab_actor_critic_with_encoder.py), soft std (std_raw)
    obs: 1149
    action: 18
    obs_contract: 'the walker''s: obs_contract above (width 1149) with KRABBY_OMNI_CLOCK_HIDE=1 and
      KRABBY_OMNI_STAND_OBS=0 -- both networks read the SAME harness observation; the stand net''s input differs only by
      the actor-side mask and the height command in column 15, both written on its own copy after its own estimate'
    trained: actor.actor_backbone only (model_state_dict differs from the walker's in actor.actor_backbone.* alone)
    frozen_at_walker: actor.scan_encoder, actor.history_encoder, actor.priv_encoder, critic, std_raw, estimator
    estimator: estimator_state_dict == the walker's, bitwise (the launcher refuses a stand checkpoint whose estimator
      differs from S1's)
    checkpoint: 'rsl_rl format: model_state_dict (35 keys, same keys / shapes as the walker''s), estimator_state_dict,
      optimizer_state_dict, iter 5000, infos.sh_dagger (arm mask, stand_mask 1, seed 17, iterations 5000,
      residual_deadband 0.25, trim_branch / trim_min, s1_sha256, r_knob, height_command, clip, warm_start, forward, code
      shas) and infos.sn_dagger (the predecessor''s block: stand_mask 1, s1_sha256, arm, seed, r_knob); loads strict into
      a runner built with KRABBY_STD_PARAM=soft'
  deployment:
    # the routing contract EXACTLY as evaluated (PLAN H1-H6 + the CHARTER 3 deviations, REPORT 2); the reference
    # implementation is the campaign's sh_core (ONE implementation shared by the trainer, the eval launcher, the table
    # test and the video recorder)
    switch: 'HARD switch, no blending, no debounce (as before): the stand net acts on the EFFECTIVE stand rows = stand
      holds OR restore rows (sh_core.effective_stand / route: torch.where(stand_eff, a_stand, clamp(S1, +-1))), the
      walker (S1) on every other row; both networks run every step. Restore rows are stand-net rows'
    entry_exit: 'entry on the FIRST stand step; on the step the command leaves stand the stand net keeps acting if a
      restore engages (below) and hands back to S1 when it completes or times out, otherwise S1 acts from that step;
      turn holds (speed 0 with a facing change) stay S1''s; the latch is re-derived on reset; a stand arriving
      mid-restore merges (the restore ends, the new stand continues from the limiter''s state)'
    input: 'sh_core.stand_net_input(obs, stand_estimator, p0, p1, num_prop, mask=1, h_cmd_limited=h_lim, restoring) =
      the predecessor''s input (experiments/2026-10-11_stand_network/scripts/sn_common.py stand_net_input: the stand
      checkpoint''s OWN estimator on the UNMASKED prop obs[:, :num_prop] -> a NEW tensor cat(obs[:, :p0], est, obs[:,
      p1:]) -> the A-mask because stand_mask is 1: the current step''s last-action block (cols 65-82) = 0.0 and the
      contact / current-sense proxy block (cols 83-88) = -0.5, and the same two blocks of each of the 10 history frames
      (cols 259 + 89 j + 65..88)), then, AFTER the estimate and on that new tensor only: column 15 (the hidden clock
      column, 0 for the walker) = (h_lim - 1.064) / 0.4 on every row (history frames untouched), and on restore rows the
      current-frame command columns 5, 8, 9, 10 (yaw-rate command, xy command, its norm) = 0. The harness obs is never
      written (S1 never sees a masked or height-written frame)'
    forward: act_inference(stand_net_input(...), hist_encoding=True) -- the actor mean (the std never acts); p0 / p1 /
      num_prop from the estimator cfg, never hard-coded
    action: 'stand rows: a_stand = q18(h_lim) + deadband(clamp(a_net, +-1), 0.25) -- the residual is clamped to +-1,
      then its hip / knee entries (action columns 6-17) with |r| < 0.25 are set to 0 (HARD: r <- r if |r| >= 0.25 else
      0; the cams 0-5 never), then the posture q18(h_lim) is added (an exactly-zero posture is not added: at 1.064 the
      result is the deadbanded residual bit for bit); hip / knee rod targets clamped to +-4.8, cams to +-1
      (sh_core.stand_action). S1 rows: clamp(S1, +-1) (sh_core.s1_clamp). The harness wrapper''s clip_actions is raised
      from 1.0 to 4.8 at RUNTIME only (env.clip_actions after the build; the config value stays 1.0), so the explicit
      +-1 on S1''s rows is load-bearing'
    posture_map: 'q(h) = (q_hip, q_knee_left) in action units: campaign-local IK at constant foot reach (U0 0.3742 m,
      scripts/sh_kin.py q), tabulated on a 0.5 mm grid whose nodes include 1.064 and interpolated linearly in float64
      (sh_core.q_table / q_map), h clamped to [0.719, 1.346] first; anchored q(1.064) = (0, 0) exactly (also within 1e-6
      m of it), q_hip strictly increasing; q(0.719) = (-2.748, +0.371), q(1.346) = (+1.880, -0.344); q18 = cams 0, the
      six hips q_hip, the knees SIDE * q_knee_left (right legs negated)'
    height_command: 'h_cmd = the ABSOLUTE root height above the mean terrain height under the six feet (sh_core.h_meas =
      root z - mean of the raycast terrain z under each foot), range [0.719, 1.346] m (facts.json frozen: h_min = hip room
      to the -45 deg stop; h_max = six-leg mean hip-rod force <= 2000 N from the measured foot loads, user decision);
      read on stand rows only and passed through the 0.08 m/s rate limiter (sh_core.HeightLimiter: per-env float64
      state, snaps onto its target within one step, targets clamped to the range) -> h_lim, which drives q and column
      15; non-stand rows target 1.064. The limiter state starts AT THE COMMAND on walk-handover starts (every eval start;
      a 1.064 command stays bitwise inert) and at the MEASURED height clamp(h_meas) on table / random-height starts'
    restore: 'H6, armed (sh_core.HeightController, one per-step order for trainer, launcher and recorder): ENGAGE when
      the slot leaves stand while |h_lim - 1.064| > 2 cm -- the stand net keeps acting with its command driven to 1.064
      through the same limiter, command columns 5 and 8-10 zeroed on these rows; COMPLETE when the limiter is at 1.064
      exactly AND every hip rod (from the measured hip angle, obs cols 29-34, through the linkage) is within 8 mm of
      rod(q(1.064)) for 0.2 s (10 consecutive steps); TIMEOUT 5.3125 s (266 steps) = (1.064 - 0.719) / 0.08 + 1 s, then
      hand back anyway (a K4 miss); either hands the row to S1. A stand commanded at 1.064 never engages'
    zero_height: 'ZERO-HEIGHT MODE -- a deployment with no height source runs this way: h_cmd fixed at 1.064. From
      walk-handover starts (every K5 row) the limiter starts at the command, so h_lim = 1.064 on every row, q = 0 (not
      added), column 15 = 0 and the restore never engages; the deadband 0.25 STILL applies. This is exactly the K5
      zero-command rows (SH_T17z: suite / walkstop es1-2, field_hard es1-4, field_turn es1), on which SH_T17 passes the
      predecessor''s G1-G5 -- so it replaces A-mask s17 at 1.064 too. From a table / random-height start the limiter
      starts at clamp(h_meas) instead (height_command above), so q and column 15 are non-zero while it ramps to 1.064 at
      0.08 m/s, and leaving the stand slot while h_lim is more than 2 cm from 1.064 engages the restore
      (sh_core.HeightController.reset / step)'
    scope: 'GATED: standing still and homed at commanded heights in [0.719, 1.346] m (K1, K6), raise / lower (K2),
      restore + hand-back (K4), no regression at 1.064 (K5), and table stand-up ONLY from tops 0.635-0.762 m from
      knee_folded / random-fold starts (K3 cells: tops 0.635 / 0.6985 / 0.762 x knee_folded / random). NOT SUPPORTED
      (run and reported, never gated): ground starts, tables below 0.635 m (the 18-in / 0.4572 m table) and rod_min
      starts -- SH_T17 STOOD (es1 / es2, head_SH_T17.json K3 per_cell): ground knee_folded 0.00 / 0.00 (35 / 28 falls per
      100), ground random 0.63 / 0.70, ground rod_min 0.22 / 0.20; 18-in table knee_folded 0.05 / 0.11, random 0.63 /
      0.68, rod_min 0.57 / 0.53; rod_min at 0.635 0.83 / 0.91 (13 / 5 falls per 100). A loaded folded knee cannot extend
      (PD demand ~2500 N m vs the knee''s 400 N m effort cap), so R_h, the teacher, has the same limit (REPORT 1, 4;
      followup stand_ground_getup)'
    constants:
      # machine-checked by the tests against sh_core (the campaign's ONE implementation) and the checkpoint's
      # infos.sh_dagger (height_command, clip)
      h_settled_m: 1.064
      h_min_m: 0.719
      h_max_m: 1.346
      rate_m_s: 0.08
      height_col: 15
      height_obs_scale: 0.4
      q_grid_step_m: 0.0005
      restore_engage_m: 0.02
      restore_rod_tol_m: 0.008
      restore_settle_s: 0.2
      restore_timeout_s: 5.3125
      restore_zero_cols: [5, 8, 9, 10]
      residual_clamp: 1.0
      residual_deadband: 0.25
      deadband_cols: '6-17'  # inclusive range of action columns (hip / knee)
      stand_rod_clamp: 4.8
      stand_cam_clamp: 1.0
      s1_clamp: 1.0
      harness_clip_actions: 4.8
      config_clip_actions: 1.0
    reference_implementation: 'experiments/2026-10-13_stand_height/scripts/sh_core.py (posture map, limiter, H6 restore,
      stand_net_input, apply_deadband, stand_action / route) + sh_eval_crab_hex_gait.py (launcher variant stand_height:
      StandHeightMode.__call__ with --sh-controller stand_net, --sh-command manifest | zero, --sh-restore armed,
      --sh-deadband 0.25) + the predecessor''s scripts/sn_common.py (stand_net_input, env_reasons); the video recorder
      sh_record_video.py runs the same step (sh_video_core.height_step, pinned bitwise against the launcher by
      tests/unit/test_sh_video.py)'
    env_required:
      # set exactly so for BOTH networks (they are the walker's carry values; sn_common.env_reasons refuses otherwise)
      KRABBY_OMNI_CLOCK_HIDE: '1'
      KRABBY_OMNI_STAND_OBS: '0'
      KRABBY_OMNI_STAND_HOLD: '0'
      KRABBY_OMNI_STAND_PARK: '0'
      KRABBY_STD_PARAM: soft
      KRABBY_OMNI_SPEED_ELLIPSE: '0.35:0.35:0.25'
      KRABBY_OMNI_FACING_OBS_CLIP: '0.6'
    env_off:
      # unset, '' or '0' (the mask and the height column are applied actor-side by stand_net_input, never env-level; R_h
      # lives in the trainer, not in an env knob); any P2R_* variable is refused by the launcher too
      - KRABBY_OMNI_STAND_MASK
      - KRABBY_OMNI_STAND_PROXY
      - KRABBY_RESTANCE
    caveat_switch_keying: 'CARRIED FORWARD from A-mask s17, unchanged: the eval''s LATCHED stand slot keeps reading
      "turning" after any facing change until a new facing target or a reset (predecessor CHARTER 3, 2026-10-13 video
      finding: on a random 180-s schedule it read TURN on 7 of 10 stands -- under the evaluated contract S1 would have
      marched through them). The stand-height launcher and video recorder route on the same latched slot, its height
      rows hold one facing per row (sh_eval_common.height_row) and its K5 rows are the predecessor''s, so no gate saw a
      stand after a facing change; the H6 restore engages on the same slot''s stand -> non-stand edge. A deployment must
      key the switch AND the restore edge on an EXPLICIT stand command (speed 0 and no facing change), as the
      predecessor''s sn_record_video.py --stand-rule schedule does (followup stand_switch_keying)'
    caveat_height_source: 'no height-command source exists outside the campaign''s eval schedules (scenarios_sh.yaml,
      the video schedules) and the trainer''s draws; without one, deploy in ZERO-HEIGHT MODE (followup
      stand_height_command_source)'
  evaluate:
    # how to re-run the K1-K6 reads / the video against the BUNDLED file (rendered as commands in the README; {name} =
    # the re-run's head name)
