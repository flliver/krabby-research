  headline: The sim's PD-torque reading of the hip load is about 14 % above what the measured foot loads imply.
  detail: 'Stand-height step 1: tau_hip - tau_knee = 246.8 N m on every stamp, while the measured foot loads imply ~216
    N m -- an unexplained ~14 % excess in the sim''s joint-torque (PD) reading, landing on the hip rod. The user capped
    h_max (1.346 m) from the measured-foot-load statics; read by PD the cap would bind below walking height (scaled
    h_max 1.02 m). The PD reading runs 27-29 % above the cap statistic in every SH_T17 height bin (27-33 % across R_h
    and SH_T17, REPORT 5; top bin 1918 N
    foot-load vs 2467 N PD); margins at the top are thin either way (top-bin p90 row 2040 N, worst leg 2065 N > 2000
    N).'
  evidence:
  - experiments/2026-10-13_stand_height/facts.md ((b) forces)
  - experiments/2026-10-13_stand_height/REPORT.md (4 item 1, 5, 10)
  - experiments/2026-10-13_stand_height/head_SH_T17.md (forces per height bin)
  levers: 'a Kit-side check of the joint-torque reading (the recorded applied_torque is the PD reading 16000 (target -
    q) - 600 v) against the contact forces through the linkage; until then the hardware hip-rod margins near h_max are
    unverified'
- id: stand_hip_contacts_0p635
  recorded: '2026-10-15 (SH_T17 adopted)'
  headline: Upright hip-contact events on the 0.635 m table have no identified source.
  detail: 'On the lowest gated top (0.635 m, 25 in) R_h''s stand-up shows hip-contact events (> 500 N on the hip body)
    with the robot UPRIGHT and still standing at the end: 3 / 200 (es1) and 2 / 200 (es2) at step 4 (tilt 2.5-3.3 deg),
    4 / 200 at step 4b es1 (random-fold starts, peak hip force 568-11 932 N, tilt 2.6-4.3 deg) -- read as coded a floor
    MISS, accepted under the pinned floor-read rule (no tilt fall, STOOD >= 0.90 on every gated top); every head read
    exits 4 on it. The table is the only object near; the source is not identified. The student is held to the same
    contacts through its max(1, R_h''s) fall line (SH_T17 table falls 0.17 / 0.33 per 100).'
  evidence:
  - 'experiments/2026-10-13_stand_height/CHARTER.md (3: R_h floor at 0.635; step 4b)'
  - experiments/2026-10-13_stand_height/step4b_read.md
  - experiments/2026-10-13_stand_height/REPORT.md (3 notes, 4 items 4-5, 10)
  levers: 'trace the contact pairs on the 0.635 cells (hip body vs table edge vs own legs) from a table-test video /
    trace npz; then decide whether the floor-read rule or the table geometry changes'
- id: stand_knee_hold_only
  recorded: '2026-10-15 (SH_T17 adopted)'
  headline: On hardware the knee is hold-only, but the height posture moves it under 1.0-1.5 kN.
  detail: 'The knee rod force is 1.0-1.5 kN in every height bin (SH_T17 foot-load / PD 1364 / 1522 N at 0.719-0.844 m
    down to 1102 / 1120 N at 1.221-1.346 m) against a 500 N rating (stand-height PLAN L53-55: the knee is treated as
    hold-only, so this is reported, not capped), and the posture map moves the knee from +0.371 to -0.344 action units
    across [0.719, 1.346] m (sh_kin.q). Whether a hold-only knee can do that under load is open; the hip-rod margins at
    the top bin are thin too (stand_pd_torque_excess).'
  evidence:
  - experiments/2026-10-13_stand_height/REPORT.md (5, 10 hardware)
  - experiments/2026-10-13_stand_height/facts.md ((a) posture map)
  levers: 'restrict hardware height commands to the band the knee can hold (or 1.064 only: zero-height mode) until the
    knee actuation is characterised; hardware rod-force modelling in the actuator layer (stand-height PLAN L209)'
- id: p2b_negative
  recorded: '2026-10-08 (phase-2 bake)'
  headline: p2b found no lever that beats continuation on walls.
  detail: 'Stage p2b (CHARTER 10, s18 screen vs REF_S1_s18 field_hard 0.8125 at n=400; gain needs >= ~0.87): C0
    continuation 0.785 (move_turn falls 5 -> 28); CL terrain-relative lift (KRABBY_FOOT_CLEAR_TERRAIN 1,
    FOOT_CLEAR_W 1.0, SWING_MIN_CLEAR_W -0.4) 0.695 -- HURT walls (122 falls vs 75: more pit falls and leg
    strikes), raised neither wall nor flat apex (flat 0.139 -> 0.112 m), flat tripod 0.74 -> 0.64, though its
    income was live at 2.8x the replay prediction; TG tilt guard 0.8275 -- no wall gain (+0.015, within noise; vs
    C0 +0.0425, needed +0.056) but fewest falls (69; pit falls 29 -> 19). The user stopped p2b (no replicates); no
    lever adopted. Both knobs stay default-off in code.'
  evidence:
  - 'experiments/2026-10-07_omni_phase2/CHARTER.md (10)'
  - experiments/2026-10-07_omni_phase2/P2B_PLAN.md
  - experiments/2026-10-07_omni_phase2/p2b_screen.json
  - experiments/2026-10-07_omni_phase2/p2b_mech_screen.json
  levers: 'closed as run; the wall deficit (field_hard 0.81 < the CHARTER 6.5 0.85 bar) stays open -- diag (40 of
    75 falls) and back are the wall holds that fail'
- id: back_overshoot
  recorded: '2026-10-08 (phase-2 bake)'
  headline: The phase-2 head overshoots backward speed by about 9 %.
  detail: 'Suite speed ratio of 6_p2a_field: back 1.087, side 1.051, fwd 1.050, diag 1.015 (the c6x head 1.030 /
    1.045 / 1.041 / 0.956). It is the S1 sibling''s cost: the CHARTER 6.1 read of S1 s18 vs its anchor is COST on
    err_back only (+0.057), and vs A1 s18 fwd / back are worse by 0.043 / 0.061 (A1 0.993 / 1.026). The user kept S1
    for its stride metrics (fwd tripod 0.53 -> 0.74, steps/m 12.4 -> 9.6, taps/m 17.5 -> 12.3, work/m -13 %). Not
    seed-general: S1 s16 tracks back at 1.041 and fwd at 0.996.'
