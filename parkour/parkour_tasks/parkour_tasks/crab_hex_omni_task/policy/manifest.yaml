  D05''s move_turn floor REJECT; formation-seed-2 confirm waived)'
recipe: 'base preset KRABBY_OMNI_PHASE=1a + the per-stage overlay named by each stage''s overlay_ref, in stage order;
  the current stage adds the removal set K (KRABBY_CLOCK_W=0.001, KRABBY_APEX_W=0.001, KRABBY_OMNI_CLOCK_HIDE=1). The
  recipe of record keeps the clock reward weights at eps 0.001 exactly as W trained (not 0).'
assets:
- dir: rsi
  file: rsi_bank_omni.npz
  source: parkour/parkour_tasks/parkour_tasks/crab_hex_omni_task/experiments/2026-09-16_1805_omni_formation/rsi_bank_omni.npz
  sha256: 98ce8420192efcbf24c37c07fa521c91e00a264d54ecb1d73b41b1d9901c46c6
  what: omni RSI reference-state bank -- forward frames (the forward 2c teacher, source 0) merged with sideways
    frames (the sideways 2a teacher, source 1), 2000 each, provenance-tagged (sha256 pinned in that campaign's
    bundle.yaml; harvest recipe in its RSI_BANK.md)
  used_by: every omni preset via KRABBY_RSI_BANK (config/crab_hex/crab_hex_omni_phases.py:132 OMNI_BANK,
    :153 OMNI_COMMON) at KRABBY_RSI_FRAC=0.2 (the forward FORMATION value, inherited); which frames a stage
    draws is KRABBY_OMNI_RSI_SOURCE (1a preset "0"; every overlay here sets "all"). The presets still read it
    from its experiments/ source path
  notes: backward travel has no RSI seed (rotating a stored frame never yields backward momentum); the bank's
    frames carry a gait-clock phase, which the clock-free stage still resets from (the clock keeps running
    internally, only its observation is zeroed)
obs_contract:
  width: 1149
  clock_columns: 'the gait clock sin/cos = obs dims 15-16 of the per-step proprio head plus the same two dims in
    each of the 10 history copies (history_length 10, config/crab_hex/crab_hex_omni_env_cfg.py:108) = 22 columns;
    the critic reads the same obs_buf'
  hide_knob: KRABBY_OMNI_CLOCK_HIDE
  refs: config/crab_hex/clock_knobs.py (KRABBY_OMNI_CLOCK_HIDE=1 -> obs term params["clock_hide"]; width-preserving;
    EVAL_SEMANTIC_KNOBS), mdp/crab_hex_omni_observations.py (CrabHexOmniParkourObservations._clock_channels /
    _hide_clock -> exact (0, 0) on every row), experiments/tools/run_phases.py EVAL_CARRY / EVAL_CARRY_DEFAULTS
  hazard: 'run_phases.EVAL_CARRY carries KRABBY_OMNI_CLOCK_HIDE (and the rest of eval_env below) into DRIVER evals only.
    scripts/rsl_rl/play.py, scripts/eval_crab_hex_gait.py run by hand, and any exported jit / onnx policy do NOT set
    it: they build the clock VISIBLE unless the variable is exported. A clock-free head fed a live clock sees inputs
    it never trained on. Likewise KRABBY_OMNI_FACING_OBS_CLIP: the obs term''s class default is None (no clip), the
    heads trained with 0.6 -- export it too.'
  eval_env:
    # exactly the env_vars of W's suite__omni run_meta.json (2026-09-25_20-31-29) minus KRABBY_OMNI_CLOCK_HIDE, which
    # is per stage (below). EVAL_CARRY keys = the semantics the heads trained under (all identical on every stage's
    # eval stamp); the rest are the driver's fixed eval block.
    carry:
      KRABBY_OMNI_FACING_OBS_CLIP: '0.6'
      KRABBY_OMNI_SPEED_ELLIPSE: '0.35:0.25:0.25'
      KRABBY_OMNI_ANG_VEL_MAX: '0.3'
      KRABBY_OMNI_CLOCK_TURN_R: '1.2'
      KRABBY_OMNI_YAW_RANGE: '-3.14159:3.14159'
      KRABBY_OMNI_FACING_OBS_ENCODING: raw
      KRABBY_OMNI_ANG_VEL_CLIP: '0.2'
      KRABBY_OMNI_RELAY_HYST: '0'
      KRABBY_OMNI_STAND_HOLD: '0'
      KRABBY_OMNI_STAND_PARK: '0'
      KRABBY_ACTION_LPF_HZ: '0'
      KRABBY_ACTION_LPF_OBS: '0'
      KRABBY_OMNI_STAND_OBS: '0'
    fixed:
      KRABBY_FLAT_TERRAIN_GEOM: ring
      KRABBY_RSI_FRAC: '0'
      KRABBY_PLAY_DEBUG_VIS: '0'
      KRABBY_PLANT: A15+B
      KRABBY_LIN_VEL_X: '0.0:0.35'
      KRABBY_TRACK_SIGMA2: '0.1'
      KRABBY_TRACK_L1_W: '-1.0'
      KRABBY_CLOCK_W: '1.0'
      KRABBY_APEX_W: '1.0'
    fixed_notes: KRABBY_FLAT_TERRAIN_GEOM=ring is REQUIRED by every omni process (apply_omni_ring_knobs); the
      LIN_VEL_X / TRACK_* / CLOCK_W / APEX_W keys are the driver's fixed FORMATION reward frame (CANARY_KEYS) --
      reward-only in an eval, they do not reach the policy (CLOCK_W 1.0 at eval does NOT show the clock; only
      KRABBY_OMNI_CLOCK_HIDE decides that)
