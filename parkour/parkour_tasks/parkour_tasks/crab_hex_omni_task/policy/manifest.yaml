    walking every non-stand hold. Env Isaac-Crab-Hex-Omni-Teacher-v0, preset 2a + the P2__S1_s18 overlay; starts walk
    handover 0.50 / table 0.40 / ground 0 / random height 0.10; one kinematic table per env, top U[0.635, 0.805] m,
    retracted poses knee_folded 0.75 / random fold 0.25 / rod_min 0, the table parked after the first exit; h_cmd ~
    U[0.719, 1.346] with a 35 % atom at 1.064; pushes suppressed until up. beta 1 -> 0 over the first third, a 10 %
    R_h-executed control slice throughout; DART sigma 0 / 0.1 / 0.3 at 1/2 / 1/4 / 1/4; LIFT-onset share 0.1; 4 GB
    reservoir; weighted MSE on the unclipped actor mean with per-leg inverse-branch-frequency weights (cap 20) PLUS the
    trim branch (a HOLD leg whose R_h cam label is saturated, |label| >= 0.0999, counts as its own branch); the deadband
    0.25 on student-executed stand rows only (labels and the R_h executor untouched); Adam 3e-4, 1024 envs, 24 steps /
    it, 16 x 4096 minibatches. ONLY actor.actor_backbone trains (scan / history / priv encoders, critic, std_raw and the
    estimator stay S1''s -- the estimator is bitwise S1''s). code_sha 14301cd2 / eval_sha 1d021625 unchanged
    (campaign-local code only)'
  training:
    # data: the trainer flags of record (run.json opts; checkpoint infos.sh_dagger -- checked by the tests)
    script: experiments/2026-10-13_stand_height/scripts/sh_dagger.py
    flags: --mode dagger --arm mask --seed 17 --iterations 5000 --deadband 0.25 --trim-branch --trim-min 0.0999
    residual_deadband: 0.25
    trim_branch: true
    trim_min: 0.0999
    warm_start: 'A-mask s17 (SN_Amask_s17 model_4000, sha256 769cf25331402afdfb23756100ec7c215dacf984a321e90a7b39d2969e4941ff,
      the superseded stand net of record, bundled beside this file as stand_network.warm_start) with
      actor.actor_backbone.0.weight[:, 15] zeroed (norm 1.74 before)'
  warm_start:
    # SH_T17's WARM-START ANCESTOR, bundled in this same folder (stand_net/model_4000.pt): bundle_policy.py syncs it from
