# Smoke-only env files (CHARTER §6.1.2; not grid cells): armed but never active -- the onset window lies beyond every
# row's episode, so the row must be bitwise a nominal of its launch class.
smokes:
  - {id: SMK_never, fault: "S1:perm", onset: "3000.0:3001.0", rows: [suite, field_light, ledge_down, pits]}
