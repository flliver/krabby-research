# Fault-injection sweep: the cell table (CHARTER §3) and the rows (CHARTER §4). Read by scripts/make_envs.py, which
# writes envs/<cell>__<row>[_L090].env from it; hashed into results/pin.json (CHARTER §7.3). Paths are relative to
# the omni task dir (parkour/parkour_tasks/parkour_tasks/crab_hex_omni_task), as in RT manifests/rows_rt.json;
# absolute paths are MAIN-checkout outputs / logs (untracked).
schema: fault_cells/v1
charter: experiments/2026-11-15_fault_injection/CHARTER.md
paths_relative_to: parkour/parkour_tasks/parkour_tasks/crab_hex_omni_task
task: Isaac-Crab-Hex-Omni-Student-Play-v0

checkpoints:
  C1S:
    path: /home/nickmagus/krabby/krabby-research/parkour/logs/rsl_rl/crab_hex_omni_student/2026-11-12_15-08-00_RT_ST_s19/model_34499.pt
    sha256_prefix: 6b48ef33
    role: student
  C1S_zero_depth:        # T12 only: a copy of C1S with params/agent.yaml zero_depth: true (scripts/make_zero_depth_ckpt.py)
    path: /home/nickmagus/krabby/krabby-research/parkour/outputs/fault_sweep/ckpt_zero_depth/model_34499.pt
    sha256_prefix: 6b48ef33
    role: student
  c1:                    # report only: B1, B4, A1-A5 + its nominals (CHARTER §4)
    path: policy/rt_11_p3b_rough/model_29500.pt
    sha256_prefix: 6d1f29be
    role: teacher

# The rows. ``onset`` = KRABBY_FAULT_ONSET (s from step 0, CHARTER §3.2); ``pre_onset_last_step`` = the last step
# that is pre-onset in EVERY env (round(lo / 0.02) - 1, the class-check horizon of CHARTER §5.1).
rows:
  suite:
    manifest: experiments/eval/scenarios_omni.yaml
    scenario: suite__omni
    base_env: experiments/2026-11-07_rod_speed_dr/envs/T00_nominal_L000_A__suite.env
    args: [--task, Isaac-Crab-Hex-Omni-Student-Play-v0, --trained-categories, "stand,fwd,side,back,diag,turn,move_turn"]
    onset: "7.5:11.5"
    pre_onset_last_step: 374
  field_light:
    manifest: experiments/2026-10-07_omni_phase2/scenarios_p2.yaml
    scenario: field_light__omni
    base_env: experiments/2026-11-07_rod_speed_dr/envs/T00_nominal_L000_A__field_light.env
    args: [--task, Isaac-Crab-Hex-Omni-Student-Play-v0]
    onset: "10.0:60.0"
    pre_onset_last_step: 499
  ledge_down:
    manifest: experiments/2026-11-10_rough_terrain/manifests/scenarios_rt.yaml
    scenario: rt_ledge_down_b2__omni
    base_env: experiments/2026-11-10_rough_terrain/manifests/envs/rt_kind_eval.env
    args: [--task, Isaac-Crab-Hex-Omni-Student-Play-v0]
    onset: "9.6:11.0"
    pre_onset_last_step: 479
  pits:
    manifest: experiments/2026-11-10_rough_terrain/manifests/scenarios_rt.yaml
    scenario: rt_pits_b2__omni
    base_env: experiments/2026-11-10_rough_terrain/manifests/envs/rt_kind_eval.env
    args: [--task, Isaac-Crab-Hex-Omni-Student-Play-v0]
    onset: "9.6:13.4"
    pre_onset_last_step: 479

# Payload levels. L090 is applied as gate_row's TP_LEVEL_FILE (the rod-speed DR / old-sweep convention): an
# envs/*_L090.env file carries the same KRABBY_* lines as its L000 twin and NO KRABBY_PAYLOAD_* key (gate_row refuses
# a level key the env file already sets).
levels:
  L000: null
  L090: experiments/2026-10-16_task4_pipeline/F19/envs/levels/L090.env

seeds: [1, 2]          # es1 every cell; es2 when the es1 worst-row F < 0.5 (CHARTER §4); kind rows es1 + es2

# ``kind_rows``: also ledge_down + pits (permanent perception levels + T12, CHARTER §4). ``c1``: the teacher also runs
# it (report only, es1, suite + field_light). ``payload``: the level the cell runs at. ``env``: extra KRABBY_* lines
# (anchors without a fault knob). ``checkpoint``: the C1S checkpoint key (default C1S).
nominals:
  - {id: NOM, payload: L000, kind_rows: true, c1: true}
  - {id: NOM, payload: L090, kind_rows: false, c1: true}

