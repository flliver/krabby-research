# The facing/tracking candidate ladder -- the campaign's only machine-readable specification.
#
# Read by `experiments/tools/run_candidates.py` (the driver) and by `resolution.py` (step 0). The
# sha256 of this file is pinned in `state.json` at the first launch; a changed hash is refused
# without `--accept-candidates-change <why>`, because every recorded decision names the recipe this
# file composes and a silent edit would re-interpret the whole ledger.
#
# Vocabulary (one word, one meaning) and the decision rule are the plans'; the `decision_rule`
# block below is frozen verbatim into the resolution entry that measures it (`D00` for the v1 rule,
# `D00s` for this v2 rule), so a later edit of it is visible in the ledger rather than only here.
#
# REVISION 2 (2026-09-21, PLAN_2026-09-21_per_category_eval.md, B6; relaunched with
# `--accept-candidates-change`): the screen, the promotions and every chain stage evaluate the
# per-category suite `suite__omni` (one launch, ten waves, one single-category episode per env); the
# decision rule is `rule_version: 2` (per category, only the candidate's trained categories
# decisive); stage floors are per-category survival band tests; the resolution inputs are the
# suite re-evaluations of the D00 heads and the B0 rescreens (checkpoint + preset + eval_dir). The
# ranked candidates and the milestones are unchanged. The pre-change file is frozen byte-for-byte
# as `tests/unit/fixtures/candidates_v1_2026-09-19.yaml` (git show 464be672).
#
# REVISION 3 (2026-09-22, the user: "narrow the scope of this plan just to resolving the C1
# question we are currently testing"; relaunched with `--accept-candidates-change`): the ladder ENDS
# at C1d. C3b, C4-C12 and the milestones M1-M3 are REMOVED -- nothing after C1d is dispatched, no
# promotion runs, and the queue is empty (phase `done`) once C1d is TERMINAL (its screen decision,
# or its seed-2 pair + pooled decision when the screen is speculative). The ranked rows C1..C1d,
# every chain and the non-candidate blocks are byte-identical to revision 2 (b910d44a), so every
# recorded recipe_id / base_recipe_id is unchanged; `promotion` and `milestone_reference` are inert
# with no milestone. The removed rows are git show b910d44a:<this file> (lines 498-632); C2r
# (18948abe) was never loaded by a driver and is not carried.
#
# EVERY path is written relative to the repository root. No driver may contain a dated path.
schema: 1

plant: A15+B
seeds: {screen: 3, confirm: 2}

#: The screen every candidate is judged by: 8000 iterations of the effective recipe's chain at
#: seed 3, scored on the per-category suite `suite__omni` alone (`eval` names ROW SHORT NAMES, which
#: `eval_morph` expands to `<name>__omni` -- the manifest ids are `suite__omni` / `slow__omni` /
#: `light__omni` / `ring__omni` / `curriculum__omni`; `slow` and `curriculum` are records now,
#: nothing runs them).
screen: {chain: scratch_1c, eval: [suite], iters: 8000}

#: The rows BOTH promotion stages (2a, 2b) evaluate at a milestone (D7): the suite in place of
#: `slow`; light/ring stay legacy rows scored by the frozen v1 per-row rule. Read by
#: `promotion_stage_list` (default PROMOTION_EVAL); `ph.EVAL_FULL` (inside code_sha) is never edited.
promotion: {eval: [suite, light, ring]}

baseline: {id: B0, chain: scratch_1c}

replay:
  script: parkour/parkour_tasks/parkour_tasks/crab_hex_omni_task/experiments/2026-09-16_1805_omni_formation/replay_reward_economy.py
  mode: advisory

# ---------------------------------------------------------------------------- resolution (D00s)
