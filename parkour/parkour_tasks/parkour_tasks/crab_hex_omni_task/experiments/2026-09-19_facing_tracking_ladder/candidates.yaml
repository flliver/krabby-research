          KRABBY_YAW_W: "0.2"
        eval: [suite]
        categories: [back, diag, fwd, move_turn, side, stand, turn]
        floor: {kind: none}

  curriculum_turnfirst:
    notes: >-
      C1d's chain (user 2026-09-22): the curriculum with its THIRD stage moved to the front -- c3's
      pool (stand, fwd, side, back, turn) and c3's economy from scratch for 3000 iterations, so
      in-place turning is trained from the first iteration, then c4, c5 and c6 verbatim. The
      "curriculum" chain is untouched (C1/C1b's records name it). Total 8000 iterations = B0.
    stages:
      - stage: t3
        base: "1a"
        iters: 3000
        from_scratch: true
        resume_from: scratch
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.25,side_l:0.16,side_r:0.16,back:0.08,turn:0.2
          KRABBY_OMNI_SLOTS: 0.15:0.65:0.2:0
          KRABBY_OMNI_DIR_BAND: ""
