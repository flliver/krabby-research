  - {head: 2b, row: slow__omni, role: pair, provenance_ok: false,
     run_dir: parkour/logs/rsl_rl/gait_eval/omni_phases/2026-09-16_1805_omni_formation/seed3_2b_006_A15pB/slow__omni/seed001/2026-09-18_18-53-00}
  - {head: 2b, row: light__omni, role: pair, provenance_ok: false,
     run_dir: parkour/logs/rsl_rl/gait_eval/omni_phases/2026-09-16_1805_omni_formation/seed3_2b_006_A15pB/light__omni/seed001/2026-09-18_18-56-10}
  - {head: 2b, row: ring__omni, role: pair, provenance_ok: false,
     run_dir: parkour/logs/rsl_rl/gait_eval/omni_phases/2026-09-16_1805_omni_formation/seed3_2b_006_A15pB_obst/ring__omni/seed001/2026-09-18_18-59-24}
  - {head: 2a-reeval, row: slow__omni, role: pair, provenance_ok: false,
