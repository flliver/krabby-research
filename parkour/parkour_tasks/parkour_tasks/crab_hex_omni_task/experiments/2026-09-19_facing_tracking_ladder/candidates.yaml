# The facing/tracking candidate ladder -- the campaign's only machine-readable specification.
#
# Read by `experiments/tools/run_candidates.py` (the driver) and by `resolution.py` (step 0). The
# sha256 of this file is pinned in `state.json` at the first launch; a changed hash is refused
# without `--accept-candidates-change <why>`, because every recorded decision names the recipe this
# file composes and a silent edit would re-interpret the whole ledger.
#
# Vocabulary (one word, one meaning) and the decision rule are the plan's; the `decision_rule`
# block below is frozen verbatim into the `D00` resolution entry, so a later edit of it is visible
# in the ledger rather than only here.
#
# EVERY path is written relative to the repository root. No driver may contain a dated path.
schema: 1

plant: A15+B
seeds: {screen: 3, confirm: 2}

#: The screen every candidate is judged by: 8000 iterations of the effective recipe's chain at
#: seed 3, scored on the flat canary `slow__omni` row alone (`eval` names ROW SHORT NAMES, which
#: `eval_morph` expands to `<name>__omni` -- the manifest ids are `slow__omni` / `light__omni` /
#: `ring__omni` / `curriculum__omni`).
screen: {chain: scratch_1c, eval: [slow], iters: 8000}

baseline: {id: B0, chain: scratch_1c}

replay:
  script: parkour/parkour_tasks/parkour_tasks/crab_hex_omni_task/experiments/2026-09-16_1805_omni_formation/replay_reward_economy.py
  mode: advisory

# ---------------------------------------------------------------------------- resolution (step 0)
# The run dirs `resolution.py` measures D00 on. `provenance_ok: true` waives the EVAL_CARRY
# provenance rule for a row recorded before a key existed (the three corrected re-evals, which are
# informational only -- their n is degenerate and they never enter a candidate's R).
# `role`: pair = a half of a cross-head pair the half-widths come from; informational = reported,
# never pooled; process_floor = the same-head 2b re-eval (4 min GPU, run 2026-09-19), paired against
# the recorded 2b slow row and reported as the process-noise floor, NEVER as the candidate R
# (decision 6). A flagged row is excluded from cross-head pairing whatever it is labelled;
# `floor_of` names the head it re-evaluates when the labels differ.
resolution_inputs:
  - {head: 1c-004, row: slow__omni, role: pair, provenance_ok: false,
     run_dir: parkour/logs/rsl_rl/gait_eval/omni_phases/2026-09-16_1805_omni_formation/seed3_1c_004_A15pB/slow__omni/seed001/2026-09-18_08-27-40}
  - {head: 1c-004, row: light__omni, role: pair, provenance_ok: false,
