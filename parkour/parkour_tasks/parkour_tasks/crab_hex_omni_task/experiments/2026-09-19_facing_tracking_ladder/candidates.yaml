# --------------------------------------------------------------------- the M1 WATCH references
# M1 has no previous milestone, so its promotion is WATCH-only against the recorded seed-3 2b rows
# and, for the 2a head, against `outputs/omni_plan/reeval_2a` (plan, Part C (ii)). The driver
# re-scores BOTH sides through `resolution.summarize_run_dir` so the F block's closed fractions
# exist on the recorded side too (step 3's hand-off: an aggregate written before the key yields
# {hold: None}). WATCH only: no milestone verdict ever reads these.
milestone_reference:
  "2b":
    slow: parkour/logs/rsl_rl/gait_eval/omni_phases/2026-09-16_1805_omni_formation/seed3_2b_006_A15pB/slow__omni/seed001/2026-09-18_18-53-00
    light: parkour/logs/rsl_rl/gait_eval/omni_phases/2026-09-16_1805_omni_formation/seed3_2b_006_A15pB/light__omni/seed001/2026-09-18_18-56-10
    ring: parkour/logs/rsl_rl/gait_eval/omni_phases/2026-09-16_1805_omni_formation/seed3_2b_006_A15pB_obst/ring__omni/seed001/2026-09-18_18-59-24
  "2a":
    slow: parkour/outputs/omni_plan/reeval_2a/slow__omni/slow__omni/seed001/2026-09-18_16-42-00
    light: parkour/outputs/omni_plan/reeval_2a/light__omni/light__omni/seed001/2026-09-18_16-45-24
    ring: parkour/outputs/omni_plan/reeval_2a/ring__omni/ring__omni/seed001/2026-09-18_16-48-58

# ---------------------------------------------------------------------------- the decision rule
# Frozen verbatim into D00 (kind resolution). `text` is decision 5 of the plan; the lists below are
# the same rule in the form both tools read, and the metric ids are DOTTED PATHS into the dict
# `run_phases.summarize()` returns for a row's aggregate JSON.
decision_rule:
  text: >-
    F block = facing on turn_l90, turn_r90, move_turn: the per-episode closed fraction
    clip(1 - final/max(initial, 0.15), -1, 1) (None = uninformative when initial < 0.15) and the
    signed yaw_progress_rate; T block = speed_ratio on fwd, lat_l, diag, back; guards (four) =
    completion, tripod_walking_dir (min over the four direction holds), turn_survival_l90 =
    surv[turn_l90]/surv[back] and turn_survival_r90 = surv[turn_r90]/surv[turn_l90] (falls DURING
    the turns, not the cumulative survivals nested inside completion; a conditional survival is
    MISSING when its denominator is 0 or unavailable, and the bootstrap drops zero-denominator
    resamples). WATCH, never scored: track_ratio_tail (the training-log ratio includes the ~20 %
    move+turn rows, so a successful facing fix lowers it by design), the slot-gated
    track_ratio_move_tail, dir_ratio[move_turn], tripod_by_hold[move_turn], settle, right-handed
    holds, the cumulative survivals. One standardiser everywhere: R_i = R_eval,i, the metric's D00
    paired-bootstrap half-width, never re-fitted. Block statistic z_F = mean_i(delta_i / R_i) (a
    closed fraction and a rad/s rate weigh equally); block resolution R_F = max(R_F^eval,
    R_F^seed) where R_F^eval is the paired-bootstrap 95 % half-width of z_F itself and R_F^seed is
    the block-level seed term of decision 6 -- likewise R_T and the two absolute-units blocks;
    guards one-sided at 99 % on their own per-metric R (max(R_eval,i, R_seed,i) single-seed).
    Null candidate all-TIE ~= 0.95^2 x 0.99^4 ~= 0.87 under eval noise (pinned), and B0_s2
    submitted against B0_s3 is TIE on both blocks and every guard by construction (pinned).
    Per block: BETTER if z > R, WORSE if z < -R, else TIE. Clear ADOPT = >= 1 block BETTER, no
    WORSE (blocks or guards), and anchored drift OK; clear REJECT = any WORSE, or a FLOOR gate (a
    MISSING metric never blocks a REJECT); UNCERTAIN = all TIE -> speculative pick = the
    candidate's speculative_default when declared (C1c: candidate), else the sign of z_F + z_T
    (exact tie -> incumbent), notify, pair queued. Anchored drift (z of candidate vs anchor >= -R on both blocks
    and every guard) is a precondition of ANY ADOPT, clear or speculative, s3 or pooled -- a
    clear-ADOPT screen that fails it is recorded confidence: uncertain (evidence.anchored_drift:
    FAIL), status speculative, pick REJECT, and queues the pair exactly like an all-TIE UNCERTAIN;
    at the pooled level drift = the candidate's two-seed mean deltas vs the anchor's s3 (and its s2,
    paired seed-wise, when the anchor recipe has an ok s2 screen) at R_F^pooled/R_pooled,i, and a
    pooled drift pass with a pooled clear ADOPT is an ADOPT (a different pick -> self-overrule as
    usual). MISSING in a guard -> a decided REJECT (TERMINAL) with confidence: uncertain,
    evidence.missing: [<guards>] + WATCH and NO pair (a pair cannot supply the metric;
    decide --choose run re-runs the candidate later);
    MISSING in F/T -> that metric leaves the block mean and the best outcome is a
    speculative ADOPT. Absolute-units candidates (C3a, C3b -- any candidate that changes the
    command cap/clip or, if ever added, the speed ellipse): F = facing_closed + whole-hold
    net_yaw_rate_toward, T = achieved_vx m/s.
  blocks:
    F:
      level: 0.95
      metrics: [facing_closed_by_hold.turn_l90, facing_closed_by_hold.turn_r90,
                facing_closed_by_hold.move_turn, yaw_progress_by_hold.turn_l90,
                yaw_progress_by_hold.turn_r90, yaw_progress_by_hold.move_turn]
    T:
      level: 0.95
      metrics: [ratio_by_hold.fwd, ratio_by_hold.lat_l, ratio_by_hold.diag, ratio_by_hold.back]
    F_abs:
      level: 0.95
      metrics: [facing_closed_by_hold.turn_l90, facing_closed_by_hold.turn_r90,
                facing_closed_by_hold.move_turn, net_yaw_by_hold.turn_l90,
                net_yaw_by_hold.turn_r90, net_yaw_by_hold.move_turn]
    T_abs:
      level: 0.95
      metrics: [achieved_speed_by_hold.fwd, achieved_speed_by_hold.lat_l,
                achieved_speed_by_hold.diag, achieved_speed_by_hold.back]
  guards:
    level: 0.99
    metrics: [completion, tripod_walking_dir, turn_survival_l90, turn_survival_r90]
  #: Reported in every DECISION line, scored by nothing. Every id here is a real `summarize()` key
  #: (plus the two training-log ratios the driver injects into the screen), so a WATCH line carries
  #: numbers rather than None -> None -- except on the SCREEN row (`slow__omni`), where five of them
  #: name holds that row does not have (`lat_r`, `move_turn_r`, and `turn_l90.settle` whenever no
  #: episode settled) and the two training-log ratios do not exist until the window's log does.
  #: Ring completion is decision 6's OTHER watched quantity; it is not an id at all but a per-ROW
  #: rule, applied by the milestone comparison -- and it is CONDITIONAL: "ring completion WATCH at
  #: milestones UNLESS the bootstrap resolves it" (decision 6). `_row_worse` therefore strips
  #: `completion` from the ring row's guards only when that row's own resolution carries no
  #: half-width for it; with the shipped D00 (`by_row[ring__omni].metrics.completion`) it is scored
  #: like every other guard, and the MILESTONE line says which.
  watch: [track_ratio_tail, track_ratio_move_tail, ratio_by_hold.move_turn,
          tripod_by_hold.move_turn, facing_by_hold.turn_l90.settle,
          facing_by_hold.turn_r90.settle, ratio_by_hold.lat_r, ratio_by_hold.move_turn_r,
          facing_closed_by_hold.move_turn_r, survival_by_hold.turn_l90,
          survival_by_hold.turn_r90]
  #: The sideways CHARTER's measured floors (2026-09-11_0414_sideways_formation/CHARTER.md:227),
  #: cited until the bootstrap resolves the same quantity; the bootstrap supersedes them.
  charter_floors: {completion: 0.10, tripod_walking_dir: 0.056}
  bootstrap: {B: 2000, paired_on: env_index, rng_seed: 20260919}
  #: The head every cross-head pair is measured AGAINST (decision 6: "1c-004 vs 2b, 1c-004 vs
  #: 2a-reeval, per row"). Pinned rather than inferred from the order of `resolution_inputs`: the
  #: per-metric R is the MAX over the pairs a control forms, so a reorder of that list would
  #: silently re-fit D00 after decisions had already been taken against it.
  control_head: 1c-004

# ---------------------------------------------------------------------------- chains
# A chain is a list of stages. `base` names the PRESET the stage runs on (KRABBY_OMNI_PHASE), never
# a new preset: every difference from that preset is an env OVERLAY, recorded in params/env.yaml
# and audited per run by `overlay_checks`. `holds` is the cumulative set of eval holds the stage's
# capabilities cover (RETENTION compares the PREVIOUS stage's holds); `floor` is decision 4's
# stage gate.
chains:
  scratch_1c:
    notes: the incumbent recipe at equal compute -- the 1c preset from scratch for 8000 iterations
    stages:
      - stage: "1c"
        base: "1c"
        iters: 8000
        from_scratch: true
        resume_from: scratch
        overlay: {}
        eval: [slow]
        holds: [stand, fwd, lat_l, diag, back, turn_l90, turn_r90, move_turn]
        floor: {kind: dead_walker}

  scratch_c6:
    notes: >-
      C1c's attribution arm: the curriculum's FINAL pool for the whole 8000 iterations, from
      scratch, so "the pool" and "the staging" are separable. Economy identical to every
      curriculum stage.
    stages:
      - stage: c6
        base: "1a"
        iters: 8000
        from_scratch: true
        resume_from: scratch
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.14,side_l:0.09,side_r:0.09,back:0.09,omni:0.14,turn:0.1,fwd_turn:0.06,side_l_turn:0.035,side_r_turn:0.035,omni_turn:0.07
          KRABBY_OMNI_SLOTS: 0.15:0.55:0.1:0.2
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [slow]
        holds: [stand, fwd, lat_l, lat_r, back, turn_l90, turn_r90, move_turn, move_turn_r, diag]
        floor: {kind: dead_walker}

  curriculum:
    notes: >-
      The user's additive capability curriculum: one command type enabled at a time, every enabled
      type keeping at least POOL_FLOOR_SHARE (0.025) of the windows, backward from c2 (user
      amendment 2026-09-19), move+turn share ramping 0.10 -> 0.15 -> 0.20 and never above the
      incumbent's 0.20. The economy is UNIFORM along the chain (FACING 0.2:0.6, YAW_W 0.2, no
      DIR_BAND, RSI from the merged bank): the 1c failure was a drift under a fixed economy and a
      stage whose economy differs from its neighbour's is the handoff that lost forward travel at
      1a->1b. Consecutive stages differ only in the pool (+ the RSI source at c1->c2).
      Total 8000 iterations = B0. c4-c6 command world-held move+turn at the 0.3 rad/s cap, which is
      infeasible on this plant (caveat 1) -- the confound C1b and C1c are for.
    stages:
      - stage: c1
        base: "1a"
        iters: 1000
        from_scratch: true
        resume_from: scratch
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.2,fwd:0.8
          KRABBY_OMNI_SLOTS: 0.2:0.8:0:0
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: "0"
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [curriculum]
        holds: [stand, fwd]
        floor: {kind: survival, row: curriculum, hold: fwd, min: 0.30}
      - stage: c2
        base: "1a"
        iters: 1000
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.2,fwd:0.3,side_l:0.2,side_r:0.2,back:0.1
          KRABBY_OMNI_SLOTS: 0.2:0.8:0:0
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [curriculum]
        holds: [stand, fwd, lat_l, lat_r, back]
        floor: {kind: survival, row: curriculum, hold: back, min: 0.30}
      - stage: c3
        base: "1a"
        iters: 1000
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.25,side_l:0.16,side_r:0.16,back:0.08,turn:0.2
          KRABBY_OMNI_SLOTS: 0.15:0.65:0.2:0
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: []
        holds: [stand, fwd, lat_l, lat_r, back, turn_l90, turn_r90]
        floor: {kind: none}
      - stage: c4
        base: "1a"
        iters: 1500
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.22,side_l:0.14,side_r:0.14,back:0.1,turn:0.15,fwd_turn:0.05,side_l_turn:0.025,side_r_turn:0.025
          KRABBY_OMNI_SLOTS: 0.15:0.6:0.15:0.1
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [curriculum]
        holds: [stand, fwd, lat_l, lat_r, back, turn_l90, turn_r90, move_turn, move_turn_r]
        floor: {kind: survival, row: curriculum, hold: move_turn_r, min: 0.30}
      - stage: c5
        base: "1a"
        iters: 1500
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.15,side_l:0.1,side_r:0.1,back:0.1,omni:0.15,turn:0.1,fwd_turn:0.07,side_l_turn:0.04,side_r_turn:0.04
          KRABBY_OMNI_SLOTS: 0.15:0.6:0.1:0.15
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: []
        holds: [stand, fwd, lat_l, lat_r, back, turn_l90, turn_r90, move_turn, move_turn_r, diag]
        floor: {kind: none}
      - stage: c6
        base: "1a"
        iters: 2000
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.14,side_l:0.09,side_r:0.09,back:0.09,omni:0.14,turn:0.1,fwd_turn:0.06,side_l_turn:0.035,side_r_turn:0.035,omni_turn:0.07
          KRABBY_OMNI_SLOTS: 0.15:0.55:0.1:0.2
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [slow, curriculum]
        holds: [stand, fwd, lat_l, lat_r, back, turn_l90, turn_r90, move_turn, move_turn_r, diag]
        floor: {kind: none}

# ---------------------------------------------------------------------------- ranked candidates
# Rank order IS this list's order. Each is screened on the EFFECTIVE recipe (the adopted choices of
# every candidate ranked before it) at seed 3 for 8000 iterations; its control is that recipe's own
# ok s3 screen.
candidates:
  - id: C1
    kind: curriculum
    chain: curriculum
    teacher_overlay: {}
    question: >-
      Does the user's additive capability curriculum (one command type at a time, floor shares
      kept, move+turn ramped 0.10 -> 0.15 -> 0.20) buy facing AND translation over the
      single-stage incumbent at the same 8000 iterations? CONFOUND: c4-c6 draw world-held
      move+turn at the 0.3 rad/s cap, which the plant cannot deliver at any commandable speed
      (caveat 1) -- C1b re-screens with a 70 % smaller turn demand and C1c separates the pool from
      the staging.

  - id: C1b
    kind: curriculum
    chain: curriculum
    teacher_overlay: {}
    depends_on: [C1]
    pool_edit: {ang_scale: {"*_turn": 0.3}}
    conditional: >-
      decision(C1).chosen == REJECT and (decision(C1).floor_stage is None or
      decision(C1).floor_stage >= c4)
    question: >-
      Was the curriculum rejected because of the infeasible move+turn demand? Same chain with a
      0.09 rad/s cap on every *_turn type (0.3 x the recipe's ang_vel_max, still above the walking
      turn bound the ellipse leaves) -- a 70 % smaller demand on the rows that cannot be
      delivered, training distribution only.

  - id: C1c
    kind: curriculum
    chain: scratch_c6
    teacher_overlay: {}
    depends_on: [C1]
    conditional: decision(C1).chosen == ADOPT
    speculative_default: candidate
    question: >-
      Attribution of an adopted curriculum: was it the POOL (all types at c6's mix for the whole
      window) or the STAGING (one type at a time)? On all-TIE the simpler recipe is the
      speculative pick (Occam) and the confirming pair still runs. Its chain's own seed resolution
      is D00c-scratch_c6.

  - id: C2
    kind: reward
    stages: all
    overlay: {KRABBY_YAW_PROGRESS_W: "3.0"}
    replay_args: ["--yaw-progress-w", "3"]
    question: >-
      Price (mechanism 1): the reachable gain from turning at the plant's 0.08 rad/s is 0.206/s
      against a 1.638/s translation stake. reward_yaw_progress at 3.0 raises the reachable prize
      to 0.366/s without paying a robot that never turns (the even track_ang_vel_z_exp kernel
      does that and is not touched here).

  - id: C3a
    kind: kinematics
    stages: all
    absolute_units: true
    eval_carry: [KRABBY_OMNI_ANG_VEL_MAX, KRABBY_OMNI_CLOCK_TURN_R]
    overlay: {KRABBY_OMNI_ANG_VEL_MAX: "0.21", KRABBY_OMNI_CLOCK_TURN_R: "1.72"}
    question: >-
      Kinematics (mechanism 2): ang_vel_max 0.3 is ~2x the plant's estimated 0.15-0.18 rad/s turn
      ceiling. 0.21 with a CADENCE-PRESERVING radius (1.72 x 0.21 = 0.361 m/s, the shipped 1.2 x
      0.3 = 0.36) also cuts the angular kernel's marginal turn incentive by ~36 %, so C2 belongs
      first. ABSOLUTE UNITS: the cap is the denominator of every ratio, so this candidate is
      scored in m/s and rad/s. The clip stays 0.2, leaving the P-control's linear region
      0.133-0.14 rad (near bang-bang) -- C3b is the paired variant that also moves the clip.

  - id: C3b
    kind: kinematics
    stages: all
    absolute_units: true
    depends_on: [C3a]
    eval_carry: [KRABBY_OMNI_ANG_VEL_MAX, KRABBY_OMNI_ANG_VEL_CLIP, KRABBY_OMNI_CLOCK_TURN_R]
    overlay: {KRABBY_OMNI_ANG_VEL_MAX: "0.18", KRABBY_OMNI_ANG_VEL_CLIP: "0.12",
              KRABBY_OMNI_CLOCK_TURN_R: "2.0"}
    conditional: >-
      decision(C3a).chosen != REJECT or decision(C3a).pooled_confidence in (uncertain, disputed)
    question: >-
      The paired cap variant: 0.18 rad/s at the kinematic bound with the dead band moved to 0.12
      (a 0.08 rad linear region instead of 0.133) and a cadence-preserving radius (2.0 x 0.18 =
      0.36). A clear seed-3 REJECT of C3a -- no pair -- skips this arm. ABSOLUTE UNITS.

  - id: C4
    kind: reward
    stages: all
    overlay: {KRABBY_OMNI_FACING_TURN_W: "0.8"}
    replay_args: ["--facing-turn-w", "0.8"]
    question: >-
      Price (mechanism 1), turn rows only: reward_facing_exp_turn_slot at 0.8 raises the settle
      bonus on the turn slots from 0.12 to 0.60/s across the settled-0.1-rad vs 1.2-rad span
      (weight 0.2 -> 1.0 on that span) and pays exactly 0 on every translation row, so the
      translation stake is untouched.

  - id: C5
    kind: observation
    stages: all
    eval_carry: [KRABBY_OMNI_FACING_OBS_ENCODING]
    overlay: {KRABBY_OMNI_FACING_OBS_ENCODING: sincos}
    question: >-
      Observation (mechanism 3): slots 6/7 clip the facing error at 0.6 rad, so the policy is
      magnitude-blind above it and cannot tell 0.7 rad from 1.57. (sin, cos) of the UNCLIPPED
      error is bounded by construction and keeps the magnitude. Screened from scratch, which is
      what an observation change needs.

  - id: C6
    kind: reward
    stages: all
    overlay: {KRABBY_OMNI_TRACK_FACING_SIGMA: "1.0"}
    replay_args: ["--coupled-sigma", "1.0"]
    question: >-
      Coupling (mechanism 1): ignoring facing costs translation NOTHING today -- the command term
      re-projects a held world travel direction into the body frame every step. Multiplying the
      stock tracking kernel by exp(-(herr/1.0)^2) makes it cost, on every row. After the cheaper
      fixes, because it lowers the translation income a candidate before it may have bought.

  - id: C7
    kind: kinematics
    depends_on: [C1b]
    pool_edit: {ang_scale: {"*_turn": 0.3}}
    conditional: recipe.has_pool and decision(C1b).chosen != ADOPT
    question: >-
      Reduced-demand move+turn types on whatever pool the recipe carries (0.3 x the recipe's
      cap/clip on every *_turn type): the same lever C1b tested inside a rejected curriculum,
      applied to an ADOPTED one. Training distribution only -- the eval holds are unchanged.

  - id: C8
    kind: economy
    stages: all
    teacher_overlay: {KRABBY_OMNI_SLOTS: 0.05:0.55:0.15:0.25}
    overlay_by_chain:
      curriculum: {pool_edit: {set_share: {stand: 0.05}, renormalise: true}}
      scratch_c6: {pool_edit: {set_share: {stand: 0.05}, renormalise: true}}
      scratch_1c: {stages: all, overlay: {KRABBY_OMNI_SLOTS: 0.05:0.65:0.1:0.2}}
    question: >-
      Economy (mechanism 5): the stand share is 0.15 of every window and the shipped terms pay a
      stander ~1.0/s. 0.05 with the freed share redistributed over the WALKING types only (turn
      and move+turn shares unchanged) triples the walking exposure per window without touching
      the regime mix the facing work is measured on. On 2a/2b the same edit lands on
      SLOTS_TEACHER -> 0.05:0.55:0.15:0.25.

  - id: C9
    kind: economy
    stages: all
    overlay: {KRABBY_OMNI_PROGRESS_W: "1.5"}
    replay_args: ["--progress-w", "1.5"]
    question: >-
      Economy (lit recommendation 3): reward_forward_progress_along_command 0.6 -> 1.5 raises the
      translation stake, which is the opposite side of every facing trade above -- so it runs
      LATE, after the facing levers have been priced. The replay's alias --progress-w DOES arm
      its turn-hold income table when supplied (PLAN_AMENDMENTS 15; replay_reward_economy.py
      lines 640-650 -- one argparse dest, either spelling arms it).

  - id: C10
    kind: seeding
    stages: all
    deferred: true
    requires_knob: KRABBY_OMNI_RSI_TURN_SOURCE
    overlay: {KRABBY_OMNI_RSI_TURN_SOURCE: "2"}
    conditional: screen.yaw_progress_turn_min < 0.10
    question: >-
      Seeding (lit recommendation 6): the RSI bank holds no turn or backward frame, so a turn is
      always started from a standing pose. A source-tag-2 bank harvested from the recipe head's
      own turn holds seeds mid-turn states. DEFERRED -- the harvester (--mode turn), the
      staged-turn tuple, the staged-slot rule and their tests are outside the code freeze:
      reached with its predicate true, the driver stops at await_user:C10 code.

  - id: C11
    kind: economy
    stages: all
    overlay: {KRABBY_OMNI_ANG_TURN_ONLY: "1"}
    replay_args: ["--new-ang-turn-only"]
    conditional: screen.track_ratio_move_tail < 0.45
    question: >-
      Economy (mechanism 5), demoted: gating track_ang_vel_z_exp to the turn rows lifts the
      replay's walker-vs-creeper margin +16.6 % -> +37.5 %, but it also erases the turn-row settle
      bonus (finish vs dawdle becomes near-indifferent). It runs only if the creeper signature
      returns on the MOVE-ONLY rows (track_ratio_move_tail < 0.45 -- a creeper reads ~0.25 there
      against a walker's ~0.6).

  - id: C12
    kind: task_definition
    stages: all
    deferred: true
    user_decision: true
    requires_knob: KRABBY_OMNI_TRAVEL_FRAME
    overlay: {KRABBY_OMNI_TRAVEL_FRAME: body}
    question: >-
      Task definition: make the *_turn types' travel direction BODY-locked instead of world-held,
      which is the only change that makes move+turn kinematically honourable. It redefines the
      task of record, so it is the USER's decision (await_user:C12, answered by
      `ledger_cli decide C12 --choose run|skip`), and its knob is outside the code freeze.

# ---------------------------------------------------------------------------- milestones
# `after` = every candidate up to and including this one has a TERMINAL entry (and is not
# undecided). A milestone is (i) a zero-GPU pooled seed-2 confirmation, preceded when needed by one
# ordinary experiment `M<k>.s2`, then (ii) one promotion experiment `M<k>.promo` (2a then 2b from
# the recipe head, EVAL_FULL at both), and for M3 (iii) `M3.final_s2` from recipe_head_s2.
milestones:
  - {id: M1, after: C3b, promote: ["2a", "2b"]}
  - {id: M2, after: C7, promote: ["2a", "2b"]}
  - {id: M3, after: C12, promote: ["2a", "2b"], final: true}
