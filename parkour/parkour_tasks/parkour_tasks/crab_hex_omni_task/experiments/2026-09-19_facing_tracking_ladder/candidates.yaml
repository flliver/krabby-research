# `lad.reevals` at the D00s eval_sha for a `role: pair` entry, the newest COMPLETE stamp under
# `<eval_dir>/suite__omni/seed001` whose checkpoint matches for a `role: seed_pair` entry); a LEGACY
# entry carries `run_dir` (the validator refuses neither/both).
# `role`: pair = a half of a cross-head suite pair the per-category half-widths come from (every
# pair is measured against `decision_rule.control_head`); seed_pair = the B0 s3 / s2 rescreens
# (X01 / X02; filled by the rescreen items, never re-evaluated, excluded from cross-head pairing:
# D00bs' seed terms read them); informational = reported, never pooled -- the legacy
# slow/light/ring rows D00 was measured on (D00's light/ring `by_row` tables are COPIED into D00s,
# D7) and the three corrected re-evals (`provenance_ok: true` waives the EVAL_CARRY provenance rule
# for a row recorded before a key existed). The 2b process-floor row is dropped: the harness is
# bitwise deterministic at a fixed env_seed, so its floor is 0.0 by construction (amendment 19).
