# ---------------------------------------------------------------------------- the decision rule
# Rule v2 (D5), frozen verbatim into D00s. `text` restates it per category; `per_category` is the
# same rule in the form both tools read -- `eval_categories.expand_rule` turns it into the flat
# blocks/guards/watch shape at a comparison's decisive/present categories, with metric ids
# `cat.<category>.<key>` (dotted paths into `run_phases.summarize()['cat']`) and the composite
# `cat_tripod_min`. It equals `eval_categories.RULE_V2_PER_CATEGORY` (pinned by a test).
decision_rule:
  rule_version: 2
  text: >-
    Every metric is a per-category number of the suite__omni row (summarize()['cat'][c]: the median
    pooled over both hands of a paired category; survival = the category's own-hold survival), and
    only the categories the CANDIDATE trained at the suite's demand are decisive -- every category
    is still run and printed. Blocks (95 %): F = turn: facing_closed, yaw_progress; F_mt =
    move_turn: facing_closed, yaw_progress, a block of its own (the hold's demand is infeasible by
    construction, so it is scored RELATIVELY: both heads face the same impossible demand, and the
    noisiest facing member neither dilutes nor is diluted by F); T = fwd, side, back, diag: ratio.
    Absolute-units candidates (C3a, C3b) score F_abs = turn: facing_closed, net_yaw; F_mt_abs =
    move_turn: facing_closed, net_yaw; T_abs = fwd, side, back, diag: achieved_speed. Guards
    (one-sided 99 %): the survival of every PRESENT category (a category trained at reduced demand
    keeps it), move_turn.ratio (achieved_speed under absolute_units) -- the anti-sacrifice guard, so
    F_mt cannot be won by walking less -- and cat_tripod_min (the min of the tripod medians over the
    decisive translation categories); R_i = max(R_eval,i, R_seed,i, R_binom,i) with R_binom =
    z_0.99 sqrt(2 p(1-p)/n_c), p clipped to [0.05, 0.95], for the survival guards only, so a survival
    saturated on both heads is scored, never MISSING. Block statistic z_b = mean_i(delta_i / R_i);
    block resolution R_b = max(R_b^eval, R_b^seed). Per block: BETTER if z > R, WORSE if z < -R,
    else TIE; a block with no decisive member is N/A, never TIE. Clear ADOPT = >= 1 block BETTER, no
    WORSE block or guard, and anchored drift OK; clear REJECT = any WORSE, or a stage floor (a
    category_survival band test); a MISSING guard value -> a decided REJECT, confidence uncertain,
    no pair; all scored blocks N/A -> a terminal SKIP (confidence none, no pair); all-TIE ->
    speculative pick = the candidate's speculative_default when declared, else sign(sum_b z_b / R_b)
    over the non-N/A blocks (each block in units of its own resolution; exact tie -> incumbent),
    pair queued. WATCH, never scored: direction_error, cross_track_ratio, heading_final, settle_s,
    stand.drift_speed, move_turn.tripod, move_turn.achieved_speed (ratio units), both hands of every
    paired category, every other member and guard of a watch or untrained category (with its note),
    the legacy completion, tripod_walking_dir, track_ratio_tail, track_ratio_move_tail;
    turn_survival_l90/r90 print N/A (suite). Null candidate all-TIE ~= 0.95^3 x 0.99^9 ~= 0.78 at
    B0's decisive set in ratio units (asserted against the measured null in D00s). At milestones
    the suite row is WORSE on >= 2 decisive units; light__omni / ring__omni keep the frozen v1
    per-row rule (D00's decision_rule, copied into D00s as by_row_rule).
  per_category:
    blocks:
      F: {level: 0.95, units: ratio, members: {turn: [facing_closed, yaw_progress]}}
      F_mt: {level: 0.95, units: ratio, members: {move_turn: [facing_closed, yaw_progress]}}
      T: {level: 0.95, units: ratio,
          members: {fwd: [ratio], side: [ratio], back: [ratio], diag: [ratio]}}
      F_abs: {level: 0.95, units: absolute, members: {turn: [facing_closed, net_yaw]}}
      F_mt_abs: {level: 0.95, units: absolute, members: {move_turn: [facing_closed, net_yaw]}}
      T_abs: {level: 0.95, units: absolute,
              members: {fwd: [achieved_speed], side: [achieved_speed], back: [achieved_speed],
                        diag: [achieved_speed]}}
    guards:
      level: 0.99
      members: {stand: [survival], fwd: [survival], side: [survival], back: [survival],
                diag: [survival], turn: [survival], move_turn: [survival, ratio]}
      composite: [cat_tripod_min]
    #: REPLACES a category's non-survival guard keys for an `absolute_units` candidate.
    guards_abs: {members: {move_turn: [achieved_speed]}}
    watch:
      members:
        stand: [drift_speed]
        fwd: [direction_error, cross_track_ratio, heading_final]
        side: [direction_error, cross_track_ratio, heading_final]
        back: [direction_error, cross_track_ratio, heading_final]
        diag: [direction_error, cross_track_ratio, heading_final]
        turn: [settle_s, heading_final]
        move_turn: [tripod, direction_error, cross_track_ratio, settle_s]
      hands: true
      legacy: {completion: legacy, tripod_walking_dir: legacy, track_ratio_tail: legacy,
               track_ratio_move_tail: legacy, turn_survival_l90: N/A (suite),
               turn_survival_r90: N/A (suite)}
  #: The sideways CHARTER's measured floors (2026-09-11_0414_sideways_formation/CHARTER.md:227),
  #: carried over verbatim from the v1 rule (resolution.py reads them from the rule).
  charter_floors: {completion: 0.10, tripod_walking_dir: 0.056}
  bootstrap: {B: 2000, paired_on: env_index, rng_seed: 20260919}
  #: The head every cross-head pair is measured AGAINST (D00s: "1c-004 vs 2b, 1c-004 vs
  #: 2a-reeval"). Pinned rather than inferred from the order of `resolution_inputs`: the per-metric
  #: R is the MAX over the pairs a control forms, and without the pin the control would default to
  #: the first accepted input -- possibly a seed_pair row.
  control_head: 1c-004

# ---------------------------------------------------------------------------- chains
# A chain is a list of stages. `base` names the PRESET the stage runs on (KRABBY_OMNI_PHASE), never
# a new preset: every difference from that preset is an env OVERLAY, recorded in params/env.yaml
# and audited per run by `overlay_checks`. `categories` is sorted(decisive | watch) of
# `eval_categories.trained_categories` of the stage's COMPOSED env (the preset's env with the overlay
# on top; the validator recomputes it); RETENTION compares every category decisive at an EARLIER
# stage. `floor` is the stage gate (D6): `category_survival` = for each decisive category, FAIL only
# when the one-sided 99 % upper binomial bound on its own-hold survival (n = its distinct-env count)
# is below `min_prev` (decisive at an earlier stage) or `min_new` (new at this stage); `none` on a
# stage the screen's guards cover or that evaluates nothing; `scratch_*` keep the training-log
# `dead_walker` abort.
chains:
  scratch_1c:
    notes: the incumbent recipe at equal compute -- the 1c preset from scratch for 8000 iterations
    stages:
      - stage: "1c"
        base: "1c"
        iters: 8000
        from_scratch: true
        resume_from: scratch
        overlay: {}
        eval: [suite]
        categories: [back, diag, fwd, move_turn, side, stand, turn]
        floor: {kind: dead_walker}

  scratch_c6:
    notes: >-
      C1c's attribution arm: the curriculum's FINAL pool for the whole 8000 iterations, from
      scratch, so "the pool" and "the staging" are separable. Economy identical to every
      curriculum stage.
    stages:
      - stage: c6
        base: "1a"
        iters: 8000
        from_scratch: true
        resume_from: scratch
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.14,side_l:0.09,side_r:0.09,back:0.09,omni:0.14,turn:0.1,fwd_turn:0.06,side_l_turn:0.035,side_r_turn:0.035,omni_turn:0.07
          KRABBY_OMNI_SLOTS: 0.15:0.55:0.1:0.2
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [suite]
        categories: [back, diag, fwd, move_turn, side, stand, turn]
        floor: {kind: dead_walker}

  curriculum:
    notes: >-
      The user's additive capability curriculum: one command type enabled at a time, every enabled
      type keeping at least POOL_FLOOR_SHARE (0.025) of the windows, backward from c2 (user
      amendment 2026-09-19), move+turn share ramping 0.10 -> 0.15 -> 0.20 and never above the
      incumbent's 0.20. The economy is UNIFORM along the chain (FACING 0.2:0.6, YAW_W 0.2, no
      DIR_BAND, RSI from the merged bank): the 1c failure was a drift under a fixed economy and a
      stage whose economy differs from its neighbour's is the handoff that lost forward travel at
      1a->1b. Consecutive stages differ only in the pool (+ the RSI source at c1->c2).
      Total 8000 iterations = B0. c4-c6 command world-held move+turn at the 0.3 rad/s cap, which is
      infeasible on this plant (caveat 1) -- the confound C1b and C1c are for.
    stages:
      - stage: c1
        base: "1a"
        iters: 1000
        from_scratch: true
        resume_from: scratch
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.2,fwd:0.8
          KRABBY_OMNI_SLOTS: 0.2:0.8:0:0
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: "0"
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [suite]
        categories: [fwd, stand]
        floor: {kind: category_survival, row: suite, min_new: 0.10, min_prev: 0.30}
      - stage: c2
        base: "1a"
        iters: 1000
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.2,fwd:0.3,side_l:0.2,side_r:0.2,back:0.1
          KRABBY_OMNI_SLOTS: 0.2:0.8:0:0
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: [suite]
        categories: [back, fwd, side, stand]
        floor: {kind: category_survival, row: suite, min_new: 0.10, min_prev: 0.30}
      - stage: c3
        base: "1a"
        iters: 1000
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.25,side_l:0.16,side_r:0.16,back:0.08,turn:0.2
          KRABBY_OMNI_SLOTS: 0.15:0.65:0.2:0
          KRABBY_OMNI_DIR_BAND: ""
          KRABBY_OMNI_RSI_SOURCE: all
          KRABBY_OMNI_FACING: 0.2:0.6
          KRABBY_YAW_W: "0.2"
        eval: []
        categories: [back, fwd, side, stand, turn]
        floor: {kind: none}
      - stage: c4
        base: "1a"
        iters: 1500
        from_scratch: false
        resume_from: previous_stage
        overlay:
          KRABBY_OMNI_CMD_POOL: stand:0.15,fwd:0.22,side_l:0.14,side_r:0.14,back:0.1,turn:0.15,fwd_turn:0.05,side_l_turn:0.025,side_r_turn:0.025
          KRABBY_OMNI_SLOTS: 0.15:0.6:0.15:0.1
