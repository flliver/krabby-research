# PPO-construction campaign (plan /home/nickmagus/.claude/plans/foamy-wondering-ullman.md; CHARTER.md).
#
# THE SHAPE. Reference-only, the same shape as ../2026-09-28_side_bisect/candidates.yaml: this file
# runs NO candidate queue. Every arm is a chain reached ONLY through `references:` (one entry per
# chain x seed, named `<chain>_s<seed>`), launched by scripts/run_arm.sh as
# `launch_candidates.sh --campaign-dir <this dir> --reference-chain <chain>_s<seed>`. `screen`,
# `baseline`, `seeds` and `decision_rule` are carried ONLY so the file type-checks
# (`validate_candidates` needs a screen/baseline chain that exists and a `decision_rule` that expands
# at the full category set) -- chain C__C0 doubles as the never-queued screen/baseline chain AND the
# C bed's control arm, so nothing here points at an unrelated run. A NEW campaign dir: no B<k>, no
# `--accept-*` debt, and none of the side bisect's resume hazards (HANDOFF_PPO 7.J; fresh names).
#
# THE BEDS (CHARTER section 2). Each stage overlay starts with the side-bisect chain's overlay copied
# VERBATIM (candidates_v16.yaml: C :146-161, C_lr :353-370, C_lr_rsi :627-646) and then adds the
# arm's knobs. Base `1b`, from scratch, 3000 iterations, 256 envs, eval row `side22_25` (the driver's
# lat_l-only row; ../eval/scenarios_omni.yaml). The two-direction beds' both-hands eval
# (../2026-09-28_side_bisect/scenarios_side_lr.yaml, side22_25lr__omni) is run by scripts/run_arm.sh
# outside the driver, with the arm's own driver-eval env (it is not a driver row: the shared
# scenarios_omni.yaml and every omni campaign's eval_sha stay put).
#   C        one direction, SB chain C (FAST historically: X02 s3, X07 s2)
#   C_lr     two directions, RSI off, SB chain C_lr (X14 SLOW/SLOW)
#   C_lr_rsi two directions, RSI 0.2 from bank A, source all, SB chain C_lr_rsi (X16 SLOW/SLOW);
#            its *_st twins add KRABBY_RSI_CAM_STAGE=1 -- rung 0b (CHARTER 5) picks the family.
#
# THE ARMS (CHARTER section 2; every knob default-off, registered in motion_knobs/omni_knobs):
#   C0  no construction knob (the incumbent). Two-direction beds add KRABBY_PPO_HAND_DIAG=1 on EVERY
#       arm, C0 included (diagnostic only; parameters and RNG bit-identical).
#   A   KRABBY_ACTION_BOUND_LOSS 0.001 with KRABBY_ACTION_BOUND_RAMP 0.0001:0.001:500 (hinge at
#       KRABBY_ACTION_BOUND 1.1 on raw mu), KRABBY_STD_PARAM soft, KRABBY_INIT_STD 0.8,
#       KRABBY_ENTROPY_COEF 0.0025. action_rate stays -0.3; mirror loss 0.5 on raw mu unchanged.
#   B   A + KRABBY_ACTION_RATE_W 0 (isolates the noise tax a bounded mean exposes).
# C-bed guard-fail bisection (C__A_ent01, C__A_std15, C__bound_only), step 4a (C_lr__A_fixed,
# C_lr__A_epochkl), 4b (C_lr__C0_1024, C_lr__A_1024), 4c INC0 (<bed>__INC0) and 4c FB/P1
# (FB_C_lr__*, P1_C_lr__*) are declared now so this file need not be re-validated mid-campaign; none
# is launched until its CHARTER trigger fires.
#
# `categories: [side, stand]` on every 1b stage: base 1b trains only `stand` (decisive) and `side`
# (watch); no overlay here touches the category set beyond the SB chain's own (C_lr/C_lr_rsi's pool
# is stand/side_l/side_r), so `sorted(decisive | watch)` = [side, stand] (`_check_stage_categories`).
# `floor: {kind: none}`: the campaign's kill rules (wiring at it 200, DEAD at it 1000, the dose read)
# are read off training telemetry by scripts/verdict.py, not by the driver's category-survival floor.
# FB/P1 stages are the SB templates' stages verbatim (their own categories, eval [suite]).
#
# absolute_units is NOT declared: the per-candidate check only fires inside `candidates:`, never for
# a chain reached solely through `references:` (KRABBY_OMNI_SPEED_ELLIPSE is an ABSOLUTE_UNITS_KEYS
# member). The RSI bank stays an ABSOLUTE path into the side-bisect dir (bank A, unchanged).
#
# This file is scripts/candidates_v2.yaml; ../candidates.yaml is a byte-identical copy (the live one
# the driver reads). Any edit is a new scripts/candidates_v<k>.yaml copied over it, logged in CHARTER 9.
# v2 (2026-10-01, before any run; review F9): the staging-off C_lr_rsi chains (C0/A/B/INC0) carry
# KRABBY_RSI_CAM_STAGE: "0" explicitly, so the overlay dump audit proves their staging state too
# (the stage_cam param absent); behaviour is unchanged (parse_flag("0") is off; nothing is written).
schema: 1

plant: A15+B
#: Carried for validation (the driver's seeds block). Every arm pins its own seed through its
#: `references:` name (<chain>_s<seed>): 11-13 screens, 14-15 extensions, 16-20 confirms (CHARTER 2).
seeds: {screen: 11, confirm: 16}

#: Carried only so the file type-checks: C__C0 is the (never-queued) screen/baseline chain. This
#: campaign has no `candidates:`.
screen: {chain: C__C0, eval: [side22_25], iters: 3000}

promotion: {enabled: false}

#: Carried for the same reason as `screen`; C__C0 is literally the C bed's control arm.
baseline: {id: C__C0, chain: C__C0}

# ---------------------------------------------------------------------------- the decision rule
# Carried only so this file validates on its own: the side-bisect file's rule, verbatim except its
# `text`. The ACTUAL gates are CHARTER.md section 4, applied by scripts/verdict.py.
decision_rule:
  rule_version: 2
  pair_on: [always]
  steps_guard_flag: false
  text: >-
    PPO CONSTRUCTION: RECORD ONLY, carried for validation parity. The campaign's real gates are
    CHARTER.md section 4 (side22_classify.py feet_ss classes AND along_cmd.py along-command classes,
    the survival tripwire, the dose / wiring / DEAD reads, VOID > UNLOCK > PARTIAL > NO-FLIP), applied
    by scripts/verdict.py -- never by this decision_rule's own blocks/guards. Every arm is launched as
    a `--reference-chain <chain>_s<seed>` run outside the ordinary candidate queue.
  per_category:
    blocks:
      F: {level: 0.95, units: ratio, members: {turn: [facing_closed, yaw_progress]}}
      T: {level: 0.95, units: ratio,
          members: {fwd: [ratio], side: [ratio], back: [ratio], diag: [ratio]}}
      LEN: {level: 0.95, units: ratio, members: {side: [steps_per_m], diag: [steps_per_m]}}
    guards:
      level: 0.99
      members:
        stand: [survival, steps_per_s]
        fwd: [survival, ratio, foot_slip, steps_per_m]
        side: [survival, ratio, foot_slip, steps_per_m]
        back: [survival, ratio, foot_slip, steps_per_m]
        diag: [survival, ratio, foot_slip, steps_per_m]
        turn: [survival, foot_slip, steps_per_rad]
        move_turn: [survival, ratio]
    watch:
      members:
        stand: [drift_speed, support_feet, gait_hz, clock_hz, cadence_ratio, six_down_frac,
                settle_six_down_s, action_jitter, action_fft_freq, joint_speed_mean, rod_speed_mean,
                contact_switch_hz, foot_slip, wz_active_frac, clock_restarts, foot_disp_end,
                work_per_s]
        fwd: [tripod, support_feet, gait_hz, clock_hz, cadence_ratio, hz_speed_slope, offset_R, step_rate_hz,
              taps_per_m, swing_apex, slip_per_m, action_jitter, swings_per_m, work_per_m,
              cam_work_per_m, direction_error, cross_track_ratio, heading_final]
        side: [tripod, support_feet, gait_hz, clock_hz, cadence_ratio, hz_speed_slope, offset_R, step_rate_hz,
               taps_per_m, swing_apex, slip_per_m, action_jitter, swings_per_m, work_per_m,
               cam_work_per_m, direction_error, cross_track_ratio, heading_final]
        back: [tripod, support_feet, gait_hz, clock_hz, cadence_ratio, hz_speed_slope, offset_R, step_rate_hz,
               taps_per_m, swing_apex, slip_per_m, action_jitter, swings_per_m, work_per_m,
               cam_work_per_m, direction_error, cross_track_ratio, heading_final]
        diag: [tripod, support_feet, gait_hz, clock_hz, cadence_ratio, hz_speed_slope, offset_R, step_rate_hz,
               taps_per_m, swing_apex, slip_per_m, action_jitter, swings_per_m, work_per_m,
               cam_work_per_m, direction_error, cross_track_ratio, heading_final]
        turn: [support_feet, steps_per_rad_pre, steps_per_rad_post, taps_per_rad, swing_apex, gait_hz, clock_hz,
               cadence_ratio, offset_R, step_rate_hz, action_jitter, swings_per_rad, slip_per_rad,
               work_per_rad, cam_work_per_rad, settle_s, heading_final]
        move_turn: [tripod, steps_per_rad, support_feet, taps_per_rad, swing_apex, foot_slip, gait_hz,
                    clock_hz, cadence_ratio, offset_R, step_rate_hz, action_jitter, swings_per_rad,
                    slip_per_rad, work_per_rad, cam_work_per_rad, direction_error,
                    cross_track_ratio, settle_s]
      hands: true
      legacy: {completion: legacy, tripod_walking_dir: legacy, track_ratio_tail: legacy,
               track_ratio_move_tail: legacy, turn_survival_l90: N/A (suite),
               turn_survival_r90: N/A (suite)}
    demoted: {}
  charter_floors: {completion: 0.10, tripod_walking_dir: 0.056}
  bootstrap: {B: 2000, paired_on: env_index, rng_seed: 20260928}
  control_head: X08-c6

