# `TP/pipeline.py check` refuses a drift (overlay_sha256 = sha256 of the compact JSON of the overlay, key order
# kept) and every PLACEHOLDER value (N_p, x_rule, the student manifest-shape split) for an official run.
schema: 1
name: task4_pipeline
notes: 'M18 Task 4 pipeline spec (PLAN.md Shape; DESIGN.md section 2). The ONE description of the runs: TP/pipeline.py gen
  writes each run''s candidates.yaml + env files from it (every driver stage resumes the previous stage by {reference:}
  in the SAME file), check verifies it (overlay shas against the shipped lineage files, placeholders, the lock), run executes
  it. PLAN wins over this file.'
