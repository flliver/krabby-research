  version: v0
lock: pipeline.lock.json
N_p: 'PLACEHOLDER: PLAN step 8 payload pilot sets it (DESIGN 2.2: the first pilot read whose 90-kg translate ratio and survival
  moved < R from the previous read, rounded up to 500, clamped to [1500, 3000]); the same N_p for p3a / p3b / p3c'
