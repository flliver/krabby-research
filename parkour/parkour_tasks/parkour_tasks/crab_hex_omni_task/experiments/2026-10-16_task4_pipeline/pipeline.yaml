    dir: R18
    walker_seed: 18
    dagger_seed: 17
    x_replay: true
    p_live: true
    notes: full-pipeline seed-18 replay; DAgger seed 17 (the recipe of record); X stand replay
    replay_of:
      notes: 'PLAN step 9 ''process reproduced'': P-config per stage against these lineage run dirs (the CHARTER 2026-10-16
        step-2 allow-list), P-early on s1 (steps 0-19) and P-live (+200) against X43 under the STOP-0 hist_latent <= 4 ULP
        amendment; a failure is STOP-R'
