    model_9800 / 9900 score 0.98/2 and 0.99/1 on the flat canary and 0.86/14 and 0.90/10 on step
    onset, so 2a occupies 0.97-0.99 flat / 0.86-0.90 step against 2b''s 0.87-0.93 / 0.75-0.84 --
