candidates:
  - id: A6000
    kind: clock
    control: baseline
    eval_carry: [KRABBY_OMNI_CLOCK_HIDE]
    user_decision: >-
      S2: the user clears A6000 after the X0 pair (ledger_cli decide A6000 --choose run)
    overlay:
      c6: {KRABBY_CLOCK_W: "0.001", KRABBY_APEX_W: "0.001", KRABBY_OMNI_CLOCK_HIDE: "1"}
    question: >-
      Does removing both clock rewards (to eps) and the clock observation (to zero) at the c5 -> c6
      boundary make the gait less rigid without losing turning, speed or survival?

  - id: A4500
    kind: clock
    control: baseline
    eval_carry: [KRABBY_OMNI_CLOCK_HIDE]
    overlay:
      c5: {KRABBY_CLOCK_W: "0.001", KRABBY_APEX_W: "0.001", KRABBY_OMNI_CLOCK_HIDE: "1"}
      c6: {KRABBY_CLOCK_W: "0.001", KRABBY_APEX_W: "0.001", KRABBY_OMNI_CLOCK_HIDE: "1"}
    question: >-
      The same removal at the c4 -> c5 boundary.

  - id: A3000
    kind: clock
    control: baseline
    eval_carry: [KRABBY_OMNI_CLOCK_HIDE]
    depends_on: [A6000, A4500]
    await_if: decision(A6000).arm_class == BREAK and decision(A4500).arm_class == BREAK
    await_why: both later boundaries BROKE -- the user decides whether the earliest runs
    overlay:
      c4: {KRABBY_CLOCK_W: "0.001", KRABBY_APEX_W: "0.001", KRABBY_OMNI_CLOCK_HIDE: "1"}
      c5: {KRABBY_CLOCK_W: "0.001", KRABBY_APEX_W: "0.001", KRABBY_OMNI_CLOCK_HIDE: "1"}
      c6: {KRABBY_CLOCK_W: "0.001", KRABBY_APEX_W: "0.001", KRABBY_OMNI_CLOCK_HIDE: "1"}
    question: >-
