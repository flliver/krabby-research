# A clock-deprecation candidate ladder -- the TEST fixture of plan step 4 (2026-09-23).
#
# Plan: /home/nickmagus/.claude/plans/lets-explore-options-for-groovy-spindle.md. This file is the
# shape step 10 writes into `OMNI/experiments/2026-09-2x_clock_deprecation/candidates.yaml`: chain
# `tail` (C1d's c4 -> c5 -> c6 forked from X08:t3), baseline X0, the three wave-1 arms (`kind:
# clock`, `control: baseline`), the RIG rule with `pair_on` and the pilot stop, and the two
# `references:` (Z's never-clocked chain, the t3_s2 confirm prefix) plus one confirm tail that forks
# `t3_s2` by `resume_from: {reference: ...}`. It is a FIXTURE: its E1/E2 run dirs do not exist
# (the validator only notes that), and the tests edit copies of it.
#
# EVERY path is written relative to the repository root.
schema: 1

plant: A15+B
seeds: {screen: 3, confirm: 2}

screen: {chain: tail, eval: [suite], iters: 5000}

promotion: {enabled: false}

baseline: {id: X0, chain: tail}

resolution_inputs:
  - {head: X08-c6, row: suite__omni, role: pair,
     run_dir: parkour/logs/rsl_rl/gait_eval/omni_phases/clock_deprecation_step0/E1_X08-c6/suite__omni/seed001/2026-09-23_00-00-00}
  - {head: X08-c4, row: suite__omni, role: pair,
     run_dir: parkour/logs/rsl_rl/gait_eval/omni_phases/clock_deprecation_step0/E2_X08-c4/suite__omni/seed001/2026-09-23_00-00-01}

decision_rule:
  rule_version: 2
  adopt_requires: RIG
  pair_on: [adopt, neutral, lone_guard]
  pilot: A6000
  steps_guard_flag: false
  text: >-
    Rule v2 per category with block RIG (10 members: steps_per_m on fwd, side, back, diag and
    steps_per_rad on turn, lower is better; support_feet on fwd, side, back, diag, turn, higher is
    better) and adopt_requires RIG; F, F_mt, T as in MQ; 23 guards (survival x7, move_turn.ratio,
    ratio@guard x4, foot_slip on the T categories and turn, steps_per_m@guard x4, steps_per_rad@guard
    on turn, stand.steps_per_s). pair_on [adopt, neutral, lone_guard]; the pilot stop on A6000's
    seed-3 RIG TIE; every flagged DECISION parks the driver.
  per_category:
    blocks:
      F: {level: 0.95, units: ratio, members: {turn: [facing_closed, yaw_progress]}}
      F_mt: {level: 0.95, units: ratio, members: {move_turn: [facing_closed, yaw_progress]}}
      T: {level: 0.95, units: ratio,
          members: {fwd: [ratio], side: [ratio], back: [ratio], diag: [ratio]}}
      RIG:
        level: 0.95
        units: ratio
        members:
          fwd: [steps_per_m, support_feet]
          side: [steps_per_m, support_feet]
          back: [steps_per_m, support_feet]
          diag: [steps_per_m, support_feet]
          turn: [steps_per_rad, support_feet]
    guards:
      level: 0.99
      members:
        stand: [survival, steps_per_s]
        fwd: [survival, ratio, foot_slip, steps_per_m]
        side: [survival, ratio, foot_slip, steps_per_m]
        back: [survival, ratio, foot_slip, steps_per_m]
        diag: [survival, ratio, foot_slip, steps_per_m]
        turn: [survival, foot_slip, steps_per_rad]
        move_turn: [survival, ratio]
    watch:
      members:
        stand: [drift_speed, support_feet, gait_hz, cadence_ratio]
        fwd: [tripod, gait_hz, cadence_ratio, hz_speed_slope, offset_R, taps_per_m, swing_apex]
        side: [tripod, gait_hz, cadence_ratio, hz_speed_slope, offset_R, taps_per_m, swing_apex]
        back: [tripod, gait_hz, cadence_ratio, hz_speed_slope, offset_R, taps_per_m, swing_apex]
        diag: [tripod, gait_hz, cadence_ratio, hz_speed_slope, offset_R, taps_per_m, swing_apex]
        turn: [steps_per_rad_pre, steps_per_rad_post, taps_per_rad, swing_apex, offset_R]
        move_turn: [tripod, steps_per_rad, support_feet, taps_per_rad, swing_apex]
      hands: true
  charter_floors: {completion: 0.10, tripod_walking_dir: 0.056}
  bootstrap: {B: 2000, paired_on: env_index, rng_seed: 20260923}
  control_head: X08-c6

